# Builds the CRM application image on amd64 hardware and runs every backend
# gate against it.
#
# Why this exists: the development machine is Apple Silicon, so every image
# built locally is linux/arm64 while the on-premise server is almost certainly
# linux/amd64 (D-66 deployment-debt register). GitHub's runners are amd64, so
# the build here is native rather than emulated — building amd64 locally would
# run under QEMU at roughly a 2-4x penalty on interpreted work and worse on
# compilation, and this image compiles nine PHP extensions from source.
#
# The workflow is deliberately Dockerfile-agnostic: it builds whatever the
# Dockerfile currently declares, so later points that add Arabic fonts and
# headless Chrome get their amd64 build verified without touching this file.
#
# arm64 is not built here. It is produced natively on the development machine,
# and building it on an amd64 runner would be the same emulation penalty in
# reverse.
#
# ── Shape: one build, then gates in parallel, then publish ───────────────────
#
# Measured on 2026-09-12 (run 34715458517, 13m12s): the image build was 21 s
# from the GHA cache; the test suite was 545 s — 70 % of the run — serial on a
# 2-vCPU runner, and it grows by 50-100 tests per point. So `build` warms the
# cache once, `bundle` builds the SPA the shell tests render, and `static`,
# `tests` (three shards) and `verify` restore the image (~20 s each) and run
# side by side. `publish` waits for all of them. The frontend gates (vue-tsc,
# Vitest) live in frontend.yml, which already caches npm and already ran on
# the same changes.

name: PHP image

on:
  push:
    branches: [main]
    paths:
      - 'docker/php/**'
      - 'crm/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/php-image.yml'
  pull_request:
    paths:
      - 'docker/php/**'
      - 'crm/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/php-image.yml'
  workflow_dispatch:

# Supersede an in-flight run when a newer commit arrives on the same ref.
concurrency:
  group: php-image-${{ github.ref }}
  cancel-in-progress: true

# GitHub already runs each `run:` under `bash -e`, so a failing command in an
# outer block stops the step. pipefail is what it does not give: without it,
# `a | b` reports only b's status, so a failing producer in a pipeline is
# invisible. Named here rather than assumed.
#
# This does NOT reach inside `docker run … sh -c '…'`. That inner script is a
# separate shell with its own settings, which is why each one below sets
# `set -e` for itself.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # ── build: the image, once, into the GHA cache ──────────────────────────────
  #
  # Nothing runs here, so nothing is loaded into the daemon: `load: true` on
  # the 2.1 GB pdf target alone cost ~40 s of the old serial run. The other
  # jobs restore from this cache, which is what `cache-to: mode=max` is for.
  build:
    runs-on: ubuntu-latest
    # A hang is cut short instead of idling a runner. Every healthy build from
    # a warm cache is under a minute; cold (base-image bump) is ~6 minutes.
    timeout-minutes: 15
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # A variable used by compose but absent from .env.example surfaces at
      # runtime as an empty value, not an error. Cheap to assert, and it keeps
      # the template honest as services are added.
      - name: Assert .env.example declares every variable compose reads
        run: |
          grep -oE '\$\{[A-Z_]+' docker-compose.yml | sed 's/\${//' | sort -u > /tmp/used
          grep -oE '^[A-Z_]+' .env.example | sort -u > /tmp/declared
          missing=$(comm -23 /tmp/used /tmp/declared)
          if [ -n "$missing" ]; then
            echo "Used by docker-compose.yml but missing from .env.example:"
            echo "$missing"
            exit 1
          fi
          echo "every compose variable is declared"

      - uses: docker/setup-buildx-action@v3

      # Registry names must be lowercase; this repository's name is not
      # (smart-technology-CRM). Computed rather than hardcoded so a rename or a
      # move to another owner cannot silently reintroduce the same failure.
      - name: Derive the lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/php" >> "$GITHUB_OUTPUT"

      # Two targets. §15.1 puts PDF generation on its own queue, so only that
      # worker needs a browser; app is what web, API and three of the four
      # workers run.
      - name: Build app target into the cache (amd64, native on this runner)
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build pdf target into the cache
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: pdf
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── bundle: the SPA the shell tests need ────────────────────────────────────
  #
  # `welcome.blade.php` loads the SPA through `@vite`, which reads
  # public/build/manifest.json; without it the shell answers 500 and
  # SpaShellTest, RequestIdTest and EndToEndConnectivityTest fail — found on
  # the first sharded run (34716862438), because the old serial job had built
  # the bundle before the tests. `vite build` only: `vue-tsc` and Vitest are
  # frontend.yml's gates on the same push, and this bundle is an input to
  # tests, not a check of its own. Runs beside `build`, not after it.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: spa-build
          path: crm/public/build
          retention-days: 1
          if-no-files-found: error

  # ── static: architecture, style and types ───────────────────────────────────
  #
  # AP-02 and AP-03 are boundaries, and a boundary that lives only in a README
  # is one refactor away from not existing. ERP-01 expects each module to be
  # extractable later, which only holds if nothing has quietly reached across
  # in the meantime. Both rule sets were confirmed to fail on a deliberate
  # violation — and, since the `set -e` fix below, that failure is confirmed to
  # fail the build too, which is a separate claim.
  #
  # Runs inside the app image: vendor/ is gitignored, so the dependencies have
  # to be installed here, and doing it in the app image means deptrac parses
  # with the same PHP version the application runs. An earlier version used
  # php:8.4-cli and failed with exit 127 because ./vendor/bin/deptrac did not
  # exist.
  static:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Restore the app image from the cache
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: false
          load: true
          tags: crm-php:ci-app
          cache-from: type=gha

      # Composer's download cache, keyed on the lockfile: a run with an
      # unchanged lock resolves nothing from the network. Mounted into the
      # container as COMPOSER_CACHE_DIR.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('crm/composer.lock') }}

      # `set -e` is the load-bearing line, and it is here because it was
      # missing. Every command below used to run in an `sh -c` script whose
      # last statement was `echo "::endgroup::"` — so the script always exited
      # 0 and the step always passed, whatever deptrac, pint or PHPStan said.
      # Run 32541862168 passed with PHPStan reporting `[ERROR] Found 1 error`
      # inside this very step.
      #
      # --memory-limit=1G because the runner has 2 vCPUs. PHPStan splits the
      # analysis across one worker per core, so two workers each carry roughly
      # five times what a ten-core machine gives them, and 256M — the image
      # default — is not enough. Measured at 2 CPUs with a cold cache: 256M
      # crashes, 384M passes. 1G is headroom for fifteen more modules.
      - name: Architecture, style and static analysis
        run: |
          mkdir -p ~/.cache/composer
          docker run --rm -v "$PWD/crm:/app" -v "$HOME/.cache/composer:/tmp/composer" \
            -e COMPOSER_CACHE_DIR=/tmp/composer -w /app --user root crm-php:ci-app sh -c '
            set -e

            composer install --no-interaction --no-progress --prefer-dist --quiet

            echo "::group::deptrac — layer boundaries (AP-03)"
            ./vendor/bin/deptrac analyse --config-file=deptrac.layers.yaml --no-progress
            echo "::endgroup::"

            echo "::group::deptrac — module boundaries (AP-02)"
            ./vendor/bin/deptrac analyse --config-file=deptrac.modules.yaml --no-progress
            echo "::endgroup::"

            echo "::group::pint — code style and strict_types (DEV-10)"
            ./vendor/bin/pint --test
            echo "::endgroup::"

            echo "::group::phpstan level 10 — types (Coding Standards §5)"
            ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
            echo "::endgroup::"
          '

  # ── tests: the suite in three shards, each against its own PostgreSQL ───────
  #
  # DEV-07 makes tests part of done, and the environment guards in
  # EnvironmentTest are the reason this runs against a real PostgreSQL rather
  # than the sqlite the skeleton shipped: sqlite's column types are advisory,
  # so D-68's NUMERIC precision cannot be asserted on it.
  #
  # Shards are balanced by measured local duration (2026-09-12: 74 / 66 / 57 s;
  # 1068 / 953 / 631 tests — Quotations, Customers and SupplierQuotations
  # tests log in over HTTP per test and cost ~0.1 s each, the rest ~0.01 s). Every
  # test directory is named in exactly one shard, and `tests/Feature` has no
  # other children — a new directory that is not added here is not run, so
  # the sum of the three `Tests:` lines is checked against the local full
  # suite on every point. Rebalance when one shard runs >30 % longer than the
  # others (`gh run view <id> --json jobs`).
  tests:
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: identity-admin
            paths: >-
              tests/Feature/Identity tests/Feature/Admin tests/Feature/Seed
              tests/Feature/Design tests/Feature/Localisation tests/Feature/Frontend
              tests/Unit
          - name: quotations-deals
            paths: >-
              tests/Feature/Quotations tests/Feature/Deals tests/Feature/Catalog
              tests/Feature/Storage tests/Feature/Audit tests/Feature/Http
          - name: suppliers-customers
            paths: >-
              tests/Feature/SupplierQuotations tests/Feature/Customers
              tests/Feature/Suppliers tests/Feature/Infrastructure tests/Feature/Database
              tests/Feature/Search tests/Feature/EnvironmentTest.php
              tests/Feature/ExampleTest.php
    name: tests (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Restore the app image from the cache
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: false
          load: true
          tags: crm-php:ci-app
          cache-from: type=gha
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('crm/composer.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: spa-build
          path: crm/public/build

      - name: Start PostgreSQL and Redis
        run: |
          # A user-defined network, NOT `--link`. Legacy links inject
          # <ALIAS>_PORT=tcp://<ip>:<port> into the linked container, and
          # Laravel's Dotenv never overrides a variable that is already set —
          # so `--link ci-redis:redis` set REDIS_PORT to a URL and phpredis
          # rejected it with "Argument #2 ($port) must be of type int". It
          # cost a red build. Docker Desktop does not inject those variables,
          # so this was invisible locally; a user-defined network injects none
          # anywhere and gives DNS by alias instead.
          docker network create ci-net

          # fsync, synchronous_commit and full_page_writes off: durability
          # buys nothing for a database that is discarded with the runner,
          # and every migration and seeder commit was paying for it.
          docker run -d --name ci-postgres --network ci-net --network-alias postgres \
            -e POSTGRES_DB=crm_test -e POSTGRES_USER=crm -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C.UTF-8" \
            -e TZ=UTC -e PGTZ=UTC \
            postgres:17.5-bookworm \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U crm -d crm_test -q && break
            sleep 2
          done
          docker exec ci-postgres psql -U crm -d crm_test -Atc 'show fsync'

          # Redis, because point 8.2 pushes real jobs onto real queues and
          # drains them with a real `queue:work` pass. Queue::fake() would have
          # made this container unnecessary and proved nothing about Redis, the
          # serializer, the worker loop or failed_jobs. Same image as
          # docker-compose.yml so CI is not testing a different Redis.
          docker run -d --name ci-redis --network ci-net --network-alias redis redis:7.4-alpine
          for _ in $(seq 1 30); do
            docker exec ci-redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done

      # .env.example leaves DB_PASSWORD blank on purpose — the compose stack
      # supplies it — so the value has to be given explicitly here.
      # docker-compose.yml is mounted because QueueConfigurationTest reads it:
      # the queue names in config/queue.php and the `--queue=` flags on the
      # worker services live in two files that never see each other, and only
      # a check that reads both can catch them drifting. It fails rather than
      # skips when absent, so this mount is not optional. The master
      # documentation is mounted for the same reason: LatencyBudgetTest reads
      # PRF-01's budget out of the §14.5 table instead of trusting a constant
      # defined in this repository.
      #
      # DEV-03 asks for a tested down path. Written is not tested, so every
      # shard runs the migrations forward, all the way back, and forward again
      # before its slice of the suite. A migration without a working down()
      # fails the build rather than being discovered during a rollback.
      - name: Migrate up, down, up (DEV-03) and run the shard
        run: |
          mkdir -p ~/.cache/composer
          docker run --rm --network ci-net \
            -e DB_PASSWORD=ci \
            -v "$PWD/crm:/app" \
            -v "$HOME/.cache/composer:/tmp/composer" -e COMPOSER_CACHE_DIR=/tmp/composer \
            -v "$PWD/docker-compose.yml:/opt/crm/docker-compose.yml:ro" \
            -v "$PWD/docs/CRM_Documentation_EN.md:/opt/crm/docs/CRM_Documentation_EN.md:ro" \
            -w /app --user root crm-php:ci-app sh -c '
              set -e

              composer install --no-interaction --no-progress --prefer-dist --quiet

              cp -n .env.example .env 2>/dev/null || true
              php artisan key:generate --force --quiet

              echo "::group::migrations up, down, up (DEV-03)"
              php artisan migrate --force
              php artisan migrate:reset --force
              php artisan migrate --force
              echo "::endgroup::"

              php artisan test ${{ matrix.shard.paths }}
            '

  # ── verify: both targets behave, and the split holds ────────────────────────
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Restore the app image from the cache
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: false
          load: true
          tags: crm-php:ci-app
          cache-from: type=gha
      - name: Restore the pdf image from the cache
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: pdf
          platforms: linux/amd64
          push: false
          load: true
          tags: crm-php:ci-pdf
          cache-from: type=gha

      # Extensions that merely load prove nothing. This runs the D-64 money
      # chain, the locale and multibyte checks, the font fallbacks, and — on
      # the pdf target only — an actual Arabic PDF render.
      - name: Verify both targets behave correctly
        run: |
          for t in app pdf; do
            echo "::group::verify crm-php:ci-$t"
            docker run --rm -v "$PWD/docker/php/verify.php:/verify.php:ro" \
              "crm-php:ci-$t" php /verify.php
            echo "::endgroup::"
          done

      # The split is only real if it holds. A browser leaking into the app
      # image would silently undo the whole point of building two.
      - name: Assert the app target carries no browser
        run: |
          if docker run --rm crm-php:ci-app sh -c 'command -v chromium || command -v node'; then
            echo "app target unexpectedly contains a browser or node runtime"
            exit 1
          fi
          docker run --rm crm-php:ci-pdf sh -c 'command -v chromium >/dev/null' \
            || { echo "pdf target is missing chromium"; exit 1; }

  # ── publish: only after every gate, only on main ────────────────────────────
  #
  # A broken image must never reach the registry, because DEV-04 treats a
  # published tag as the rollback target — so this waits for all four.
  # Tagged with the commit SHA as well as latest: DEV-04 wants a rollback to
  # the previous release in under 15 minutes, and pulling a known tag is
  # faster and more certain than rebuilding.
  publish:
    if: github.event_name == 'push'
    needs: [build, bundle, static, tests, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.build.outputs.name }}:latest
            ${{ needs.build.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
      - name: Push pdf
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: pdf
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.build.outputs.name }}:pdf-latest
            ${{ needs.build.outputs.name }}:pdf-${{ github.sha }}
          cache-from: type=gha
