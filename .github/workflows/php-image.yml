# Builds the CRM application image on amd64 hardware.
#
# Why this exists: the development machine is Apple Silicon, so every image
# built locally is linux/arm64 while the on-premise server is almost certainly
# linux/amd64 (D-66 deployment-debt register). GitHub's runners are amd64, so
# the build here is native rather than emulated — building amd64 locally would
# run under QEMU at roughly a 2-4x penalty on interpreted work and worse on
# compilation, and this image compiles nine PHP extensions from source.
#
# The workflow is deliberately Dockerfile-agnostic: it builds whatever the
# Dockerfile currently declares, so later points that add Arabic fonts and
# headless Chrome get their amd64 build verified without touching this file.
#
# arm64 is not built here. It is produced natively on the development machine,
# and building it on an amd64 runner would be the same emulation penalty in
# reverse.

name: PHP image

on:
  push:
    branches: [main]
    paths:
      - 'docker/php/**'
      - 'crm/**'
      - '.github/workflows/php-image.yml'
  pull_request:
    paths:
      - 'docker/php/**'
      - 'crm/**'
      - '.github/workflows/php-image.yml'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # GitHub already runs each `run:` under `bash -e`, so a failing command in
    # an outer block stops the step. pipefail is what it does not give: without
    # it, `a | b` reports only b's status, so a failing producer in a pipeline
    # is invisible. Named here rather than assumed.
    #
    # This does NOT reach inside `docker run … sh -c '…'`. That inner script is
    # a separate shell with its own settings, which is why each one below sets
    # `set -e` for itself.
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      # A variable used by compose but absent from .env.example surfaces at
      # runtime as an empty value, not an error. Cheap to assert, and it keeps
      # the template honest as services are added.
      - name: Assert .env.example declares every variable compose reads
        run: |
          grep -oE '\$\{[A-Z_]+' docker-compose.yml | sed 's/\${//' | sort -u > /tmp/used
          grep -oE '^[A-Z_]+' .env.example | sort -u > /tmp/declared
          missing=$(comm -23 /tmp/used /tmp/declared)
          if [ -n "$missing" ]; then
            echo "Used by docker-compose.yml but missing from .env.example:"
            echo "$missing"
            exit 1
          fi
          echo "every compose variable is declared"

      - uses: docker/setup-buildx-action@v3

      # Registry names must be lowercase; this repository's name is not
      # (smart-technology-CRM). Computed rather than hardcoded so a rename or a
      # move to another owner cannot silently reintroduce the same failure.
      - name: Derive the lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/php" >> "$GITHUB_OUTPUT"

      # Build first, verify second, publish last. A broken image must never
      # reach the registry, because DEV-04 treats a published tag as the
      # rollback target.
      # Two targets, built and verified separately. §15.1 puts PDF generation on
      # its own queue, so only that worker needs a browser; app is what web, API
      # and three of the four workers run.
      - name: Build app target (amd64, native on this runner)
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: false
          load: true
          tags: crm-php:ci-app
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AP-02 and AP-03 are boundaries, and a boundary that lives only in a
      # README is one refactor away from not existing. ERP-01 expects each
      # module to be extractable later, which only holds if nothing has quietly
      # reached across in the meantime. Both rule sets were confirmed to fail on
      # a deliberate violation — and, since the `set -e` fix below, that failure
      # is confirmed to fail the build too, which is a separate claim.
      #
      # Runs after the app image is built, inside it: vendor/ is gitignored, so
      # the dependencies have to be installed here, and doing it in the app
      # image means deptrac parses with the same PHP version the application
      # runs. An earlier version used php:8.4-cli and failed with exit 127
      # because ./vendor/bin/deptrac did not exist.
      # Architecture, style and types in one pass, because they share the
      # composer install. DEV-10 asks for automated linting; Coding Standards §5
      # asks for strict typing with no untyped escape hatches, which is what
      # PHPStan at level 10 enforces.
      #
      # `set -e` is the load-bearing line, and it is here because it was missing.
      # Every command below used to run in an `sh -c` script whose last statement
      # was `echo "::endgroup::"` — so the script always exited 0 and the step
      # always passed, whatever deptrac, pint or PHPStan said. Each tool had been
      # confirmed to fail on deliberately bad code; nothing had confirmed that
      # its failure reached the build. It did not. Run 32541862168 passed with
      # PHPStan reporting `[ERROR] Found 1 error` inside this very step.
      #
      # --memory-limit=1G because the runner has 2 vCPUs. PHPStan splits the
      # analysis across one worker per core, so two workers each carry roughly
      # five times what a ten-core machine gives them, and 256M — the image
      # default — is not enough. Measured at 2 CPUs with a cold cache: 256M
      # crashes, 384M passes. 1G is headroom for fifteen more modules, on a
      # runner with 16 GB.
      - name: Architecture, style and static analysis
        run: |
          docker run --rm -v "$PWD/crm:/app" -w /app --user root crm-php:ci-app sh -c '
            set -e

            composer install --no-interaction --no-progress --prefer-dist --quiet

            echo "::group::deptrac — layer boundaries (AP-03)"
            ./vendor/bin/deptrac analyse --config-file=deptrac.layers.yaml --no-progress
            echo "::endgroup::"

            echo "::group::deptrac — module boundaries (AP-02)"
            ./vendor/bin/deptrac analyse --config-file=deptrac.modules.yaml --no-progress
            echo "::endgroup::"

            echo "::group::pint — code style and strict_types (DEV-10)"
            ./vendor/bin/pint --test
            echo "::endgroup::"

            echo "::group::phpstan level 10 — types (Coding Standards §5)"
            ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
            echo "::endgroup::"
          '

      # D-67 puts a TypeScript SPA in front of /api/v1, and Coding Standards §5
      # requires strict typing with no untyped escape hatches. `npm run build`
      # runs vue-tsc before vite, so a type error fails here rather than
      # shipping as a runtime surprise. It also proves the bundle still builds.
      - name: Type-check and build the frontend
        run: |
          docker run --rm -v "$PWD/crm:/app" -w /app --user root node:22-bookworm-slim sh -c '
            set -e

            npm ci --no-audit --no-fund
            npm run build
          '

      # DEV-07 makes tests part of done, and the environment guards in
      # EnvironmentTest are the reason this runs against a real PostgreSQL
      # rather than the sqlite the skeleton shipped: sqlite's column types are
      # advisory, so D-68's NUMERIC precision cannot be asserted on it.
      - name: Tests (against PostgreSQL)
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_DB=crm_test -e POSTGRES_USER=crm -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C.UTF-8" \
            -e TZ=UTC -e PGTZ=UTC \
            postgres:17.5-bookworm
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U crm -d crm_test -q && break
            sleep 2
          done

          # .env.example leaves DB_PASSWORD blank on purpose — the compose stack
          # supplies it — so the value has to be given explicitly here.
          docker run --rm --link ci-postgres:postgres \
            -e DB_PASSWORD=ci \
            -v "$PWD/crm:/app" -w /app --user root crm-php:ci-app sh -c '
              set -e

              cp -n .env.example .env 2>/dev/null || true
              php artisan key:generate --force --quiet

              # DEV-03 asks for a tested down path. Written is not tested, so CI
              # runs the migrations forward, all the way back, and forward again
              # before the suite. A migration without a working down() fails the
              # build rather than being discovered during a rollback.
              echo "::group::migrations up, down, up (DEV-03)"
              php artisan migrate --force
              php artisan migrate:reset --force
              php artisan migrate --force
              echo "::endgroup::"

              php artisan test
            '
          docker rm -f ci-postgres >/dev/null

      - name: Build pdf target (amd64, native on this runner)
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: pdf
          platforms: linux/amd64
          push: false
          load: true
          tags: crm-php:ci-pdf
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extensions that merely load prove nothing. This runs the D-64 money
      # chain, the locale and multibyte checks, the font fallbacks, and — on the
      # pdf target only — an actual Arabic PDF render.
      - name: Verify both targets behave correctly
        run: |
          for t in app pdf; do
            echo "::group::verify crm-php:ci-$t"
            docker run --rm -v "$PWD/docker/php/verify.php:/verify.php:ro" \
              "crm-php:ci-$t" php /verify.php
            echo "::endgroup::"
          done

      # The split is only real if it holds. A browser leaking into the app image
      # would silently undo the whole point of building two.
      - name: Assert the app target carries no browser
        run: |
          if docker run --rm crm-php:ci-app sh -c 'command -v chromium || command -v node'; then
            echo "app target unexpectedly contains a browser or node runtime"
            exit 1
          fi
          docker run --rm crm-php:ci-pdf sh -c 'command -v chromium >/dev/null' \
            || { echo "pdf target is missing chromium"; exit 1; }

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as latest: DEV-04 wants a rollback
      # to the previous release in under 15 minutes, and pulling a known tag is
      # faster and more certain than rebuilding.
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha

      - name: Push pdf
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: docker/php
          file: docker/php/Dockerfile
          target: pdf
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:pdf-latest
            ${{ steps.image.outputs.name }}:pdf-${{ github.sha }}
          cache-from: type=gha
