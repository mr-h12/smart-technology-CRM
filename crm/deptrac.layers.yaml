# Enforces AP-03: Presentation → Application → Domain ← Infrastructure.
#
# The load-bearing rule is Domain's empty ruleset. Coding Standards §3.1 lists
# "HTTP, UI, framework, storage, queue, or vendor SDK calls" among what the
# domain must not contain, so Domain may reference nothing at all — not another
# layer, and not Illuminate. Everything else in this file is ordinary layering;
# that one line is what keeps the business rules portable, which ERP-01 needs.
#
# Application and Infrastructure may use the framework: the former coordinates
# transactions, the latter is where adapters live. Presentation may reach
# Domain directly for types, but not for decisions — that is a rule about
# behaviour, which no static tool can check, so it stays a review concern.
parameters:
  paths:
    - ./app/Modules
  layers:
    - name: Presentation
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Presentation/.*
    - name: Application
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Application/.*
    - name: Domain
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Domain/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: app/Modules/[^/]+/Infrastructure/.*
    # Model factories are test and seed scaffolding rather than a module, and
    # they live in `database/factories` because that is where Laravel's tooling
    # looks. A model naming its own factory is the framework's own pattern, so
    # the dependency is legitimate — but it is named here rather than left
    # uncovered, because an uncovered line does not fail the build and a report
    # that accumulates them is a report nobody reads.
    - name: Factories
      collectors:
        - type: classLike
          value: ^Database\\Factories\\.*

    # `App\Support\Settings` — the contract a module reads a tunable number
    # through. Named as its own layer rather than left uncovered: an uncovered
    # line does not fail the build, and this file already records why that
    # matters. Deliberately narrow — `^App\\Support\\Settings\\.*` and not all of
    # `App\Support`, so a future helper there does not inherit a licence to be
    # a cross-module channel.
    - name: SharedContracts
      collectors:
        - type: classLike
          value: ^App\\Support\\Settings\\.*
        # `D-48`'s search seam, on exactly the same terms: a contract every
        # module may name so that none of them has to name another. Added with
        # Module 3 Point 2.1; the first module dependency on it arrives with
        # Point 3.2, and until then this entry collects nothing.
        - type: classLike
          value: ^App\\Support\\Search\\.*
        # `App\Support\Http` — the response envelope every module returns.
        # Added with Module 3's shared-layer point: `ApiEnvelope` had been
        # duplicated into Identity and Admin, the two copies had already drifted
        # (Admin's carried no `error()`), and Customers would have been the third.
        # `ApiExceptionRenderer` already lived here and had to reach *into*
        # Identity to build an error body; both now sit on the shared side.
        - type: classLike
          value: ^App\\Support\\Http\\.*
        # `App\Support\Database\Precision` — `D-68`'s column scales, added
        # 2026-09-02 with Module 6 Point 1.3, the first Eloquent model to cast a
        # money column. The class exists so that a column's scale and its cast's
        # scale cannot drift apart, which is only possible if the model may name
        # it. Narrow to the one class, **not** `^App\Support\Database\.*`:
        # `StandardColumns` is migration scaffolding and a module has no
        # business calling it, so the namespace would grant more than the
        # dependency needs.
        - type: classLike
          value: ^App\\Support\\Database\\Precision$
        # `App\Support\Database\DocumentNumberAllocator` — §4.7's document
        # number, added 2026-09-07 with Module 7 Point 1.6. `DL` (Module 5) and
        # `SQ` (Module 6) each carried a byte-identical private `nextCode()`,
        # and Module 7's `QT` would have been the third — so the mechanism moved
        # to `App\Support` and the prefix stayed with the module. Named class by
        # class on `Precision`'s terms, **not** `^App\Support\Database\.*`,
        # which would hand every module `StandardColumns` as well. No ruleset
        # moves: `Deals` and `SupplierQuotations` already hold `SharedContracts`.
        - type: classLike
          value: ^App\\Support\\Database\\DocumentNumberAllocator$

    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Symfony\\.*
        - type: classLike
          value: ^Laravel\\.*

  ruleset:
    Presentation:
      - Application
      - Domain
      - Framework
      # The response envelope only. Presentation is the one layer that serialises
      # a response, so this is the narrowest edge that lets the shared
      # `ApiEnvelope` replace the duplicated copies — not a licence for
      # Presentation to reach `App\Support` at large, which is why
      # `SharedContracts` stays a deliberately narrow set of prefixes.
      - SharedContracts
    Application:
      - Domain
      - Framework
      - SharedContracts
    Infrastructure:
      - Domain
      - Framework
      - Factories
      - SharedContracts
    # Domain has no entry on purpose. An empty ruleset means "may depend on
    # nothing", which is the point.
    Factories: ~
    SharedContracts: ~
