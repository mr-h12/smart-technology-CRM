# Enforces AP-02: the twelve modules, and that none reaches into another.
#
# CLAUDE.md is explicit — cross-module work goes through interfaces or domain
# events, never another module's models. Every module below therefore has an
# empty ruleset: no module may depend on any other.
#
# That is stricter than the end state will be, deliberately. When a legitimate
# shared interface appears it is added here as a named exception with a reason,
# so each crossing is a decision that shows up in a diff rather than a habit
# that accumulates. ERP-01 expects each module to be extractable later, and a
# boundary nobody can cross by accident is what makes that possible.
#
# Storage is the first such exception, approved 2026-08-22. It is **not** one of
# AP-02's twelve: §14.2 lists it as a stack row — "local file system behind an
# abstraction layer" — so it is a foundation capability the business modules
# consume, not a peer owning a slice of the domain. It is split in two on
# purpose. A module may later be allowed to depend on StorageContract, which is
# the interfaces and the use cases; nothing is ever allowed to depend on
# StorageDriver, which is the disk, the scanner and the HTTP surface. Before
# this entry existed the module was in no layer at all, so a module reaching
# straight into the driver was reported as *uncovered* — and uncovered does not
# fail the build.
parameters:
  paths:
    - ./app/Modules
  layers:
    - name: Identity
      collectors:
        - type: directory
          value: app/Modules/Identity/.*
    - name: Customers
      collectors:
        - type: directory
          value: app/Modules/Customers/.*
    - name: Deals
      collectors:
        - type: directory
          value: app/Modules/Deals/.*
    - name: Quotations
      collectors:
        - type: directory
          value: app/Modules/Quotations/.*
    - name: Suppliers
      collectors:
        - type: directory
          value: app/Modules/Suppliers/.*
    - name: Catalog
      collectors:
        - type: directory
          value: app/Modules/Catalog/.*
    - name: Procurement
      collectors:
        - type: directory
          value: app/Modules/Procurement/.*
    - name: Outdoor
      collectors:
        - type: directory
          value: app/Modules/Outdoor/.*
    - name: Reports
      collectors:
        - type: directory
          value: app/Modules/Reports/.*
    - name: Notifications
      collectors:
        - type: directory
          value: app/Modules/Notifications/.*
    - name: Audit
      collectors:
        - type: directory
          value: app/Modules/Audit/.*
    - name: Admin
      collectors:
        - type: directory
          value: app/Modules/Admin/.*

    - name: StorageContract
      collectors:
        - type: directory
          value: app/Modules/Storage/(Domain|Application)/.*

    - name: StorageDriver
      collectors:
        - type: directory
          value: app/Modules/Storage/(Infrastructure|Presentation)/.*

    # The framework is named here for the same reason it is named in
    # deptrac.layers.yaml: without it every Illuminate call from a covered class
    # is an uncovered dependency, and a report full of uncovered lines is a
    # report nobody reads.
    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Symfony\\.*
        - type: classLike
          value: ^Laravel\\.*

  ruleset:
    Identity: ~
    Customers: ~
    Deals: ~
    Quotations: ~
    Suppliers: ~
    Catalog: ~
    Procurement: ~
    Outdoor: ~
    Reports: ~
    Notifications: ~
    Audit: ~
    Admin: ~
    # Contracts may reach the framework but never the driver — the point of the
    # split. The driver may use its own contracts, which is what implementing
    # them means.
    StorageContract:
      - Framework
    StorageDriver:
      - StorageContract
      - Framework
    Framework: ~
