# Enforces AP-02: the twelve modules, and that none reaches into another.
#
# CLAUDE.md is explicit — cross-module work goes through interfaces or domain
# events, never another module's models. Every module below therefore has an
# empty ruleset: no module may depend on any other.
#
# That is stricter than the end state will be, deliberately. When a legitimate
# shared interface appears it is added here as a named exception with a reason,
# so each crossing is a decision that shows up in a diff rather than a habit
# that accumulates. ERP-01 expects each module to be extractable later, and a
# boundary nobody can cross by accident is what makes that possible.
#
# Storage is the first such exception, approved 2026-08-22. It is **not** one of
# AP-02's twelve: §14.2 lists it as a stack row — "local file system behind an
# abstraction layer" — so it is a foundation capability the business modules
# consume, not a peer owning a slice of the domain. It is split in two on
# purpose. A module may later be allowed to depend on StorageContract, which is
# the interfaces and the use cases; nothing is ever allowed to depend on
# StorageDriver, which is the disk, the scanner and the HTTP surface. Before
# this entry existed the module was in no layer at all, so a module reaching
# straight into the driver was reported as *uncovered* — and uncovered does not
# fail the build.
parameters:
  paths:
    - ./app/Modules
  layers:
    # `DealFactsInterface` and its result `DealFacts` are collected out here, on
    # `SupplierQuotations`'s bool below: they live in `DealsContract` alone so
    # Module 7 — allowed the contract, not the module — does not trip on module
    # membership. Added 2026-09-11 with Module 7 Point 3.4.
    - name: Deals
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Deals/.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Deals\\Domain\\Contracts\\DealFactsInterface$
            - type: classLike
              value: ^App\\Modules\\Deals\\Domain\\Contracts\\DealFacts$
    # The five `QuotationsContract` classLikes are collected out below, on
    # `Suppliers`' terms (F-10 · 1.4): a token in two layers is checked against both.
    - name: Quotations
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Quotations/.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Quotations\\Domain\\Contracts\\QuotationReaderInterface$
            - type: classLike
              value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationDetail$
            - type: classLike
              value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationLine$
            - type: classLike
              value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationAdditionalLine$
            - type: classLike
              value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationNotFound$
    # `SupplierLookupInterface` is collected out by `SuppliersContract` below,
    # on exactly `Catalog`'s terms: a token in two layers is checked against both.
    - name: Suppliers
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Suppliers/.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Suppliers\\Domain\\Contracts\\SupplierLookupInterface$
    # `CatalogProductProvisionerInterface` is excluded because it is collected
    # by `CatalogContract` below, and a token in two layers is checked against
    # both: while this directory also claimed it, `ProvisionCatalogProduct`
    # (layer `Catalog`) depending on the interface it implements was reported as
    # `Catalog must not depend on Catalog`. Identity, Audit, Storage and
    # Customers never hit this because their split is disjoint by construction —
    # `(Domain|Application)` against `(Infrastructure|Presentation)`, with no
    # module-wide collector left over. This is the same disjointness, expressed
    # for a one-class contract instead of half a module. Measured, not reasoned:
    # the violation was real and `--clear-cache` did not move it.
    - name: Catalog
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/Catalog/.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\Catalog\\Domain\\Contracts\\CatalogProductProvisionerInterface$
            - type: classLike
              value: ^App\\Modules\\Catalog\\Domain\\Contracts\\CatalogItemLabelsInterface$
    # `SupplierItemPricingInterface` and its result `SupplierItemPrice` are
    # collected out here, the way `Catalog` collects its provisioner out above:
    # a class caught by both this module-wide directory and the narrow
    # `SupplierQuotationsContract` classLikes below would sit in two layers, and
    # Module 7 — allowed the contract but not the module — would trip on the
    # module membership. Excluding them makes each live in the contract layer
    # alone. Measured, not reasoned: the violation was real until this bool.
    - name: SupplierQuotations
      collectors:
        - type: bool
          must:
            - type: directory
              value: app/Modules/SupplierQuotations/.*
          must_not:
            - type: classLike
              value: ^App\\Modules\\SupplierQuotations\\Domain\\Contracts\\SupplierItemPricingInterface$
            - type: classLike
              value: ^App\\Modules\\SupplierQuotations\\Domain\\Pricing\\SupplierItemPrice$
    - name: Procurement
      collectors:
        - type: directory
          value: app/Modules/Procurement/.*
    - name: Outdoor
      collectors:
        - type: directory
          value: app/Modules/Outdoor/.*
    - name: Reports
      collectors:
        - type: directory
          value: app/Modules/Reports/.*
    - name: Notifications
      collectors:
        - type: directory
          value: app/Modules/Notifications/.*
    # `Pdf` is Module 9, added 2026-09-13 with its Point 1.0. It is the module
    # §14.6 describes and `D-79` approved a template for, and it is named for
    # the capability rather than for the quotation because §11 stores a report
    # PDF too and `D-23` wants a manual accounts export — a `QuotationPdf`
    # layer would be wrong within two modules.
    #
    # The ruleset stays **empty at this point, deliberately.** This file's own
    # header says a crossing is "added here as a named exception with a reason,
    # so each crossing is a decision that shows up in a diff rather than a habit
    # that accumulates", and every grant in the ruleset below names the point
    # that needed it. Module 9 will need two — a contract-shaped read of a
    # quotation, and `StorageContract` to write the rendered file — and each
    # arrives with the point that uses it, not ahead of it. An empty ruleset on
    # a declared layer is also what keeps a reach out of this module *reported*:
    # before Storage had an entry, a module reaching into it came back as
    # **uncovered**, and uncovered does not fail the build.
    - name: Pdf
      collectors:
        - type: directory
          value: app/Modules/Pdf/.*
    # Admin is split for the reason Audit, Storage and Identity are, approved
    # 2026-08-31 with Point 6.3 — the first crossing into it. `DB-05`'s managed
    # lists are the thing another module needs: Catalog files an item under a
    # company and the list is where a company is defined. What it must never
    # reach is `enum_lists` itself, the Eloquent model, or the HTTP surface —
    # the split puts that line where the others already are. Nothing depended
    # on `Admin` before this point, so no ruleset moves except Catalog's.
    - name: AdminContract
      collectors:
        - type: directory
          value: app/Modules/Admin/(Domain|Application)/.*

    - name: AdminDriver
      collectors:
        - type: directory
          value: app/Modules/Admin/(Infrastructure|Presentation)/.*

    # Identity is split for the reason Audit and Storage are, approved
    # 2026-08-23 with Point 2.1. Its Infrastructure holds the Eloquent models
    # for `users`, `roles`, `permissions` and `user_sessions`, and an Eloquent
    # model is a framework object by definition — so the module needs the
    # Framework layer that a bare `~` ruleset denies. The split keeps the line
    # in the right place: Domain and Application are what another module may
    # one day be allowed to depend on, and IdentityDriver — the models, the
    # tables, the HTTP surface — is what nothing may ever reach. SEC-07 makes
    # this the module every other module will eventually ask about permissions,
    # which is exactly why the crossing has to be a named interface later
    # rather than a reach into a model now.
    - name: IdentityContract
      collectors:
        - type: directory
          value: app/Modules/Identity/(Domain|Application)/.*

    - name: IdentityDriver
      collectors:
        - type: directory
          value: app/Modules/Identity/(Infrastructure|Presentation)/.*

    - name: AuditContract
      collectors:
        - type: directory
          value: app/Modules/Audit/(Domain|Application)/.*

    - name: AuditDriver
      collectors:
        - type: directory
          value: app/Modules/Audit/(Infrastructure|Presentation)/.*

    # Catalog's published surface, added 2026-09-03 with Module 6 Point 3.1 —
    # `D-22`'s automatic product add, which Module 6 discovers and Catalog owns.
    #
    # **One `classLike`, not a directory.** Identity, Audit, Storage and
    # Customers are each split as `(Domain|Application)` versus
    # `(Infrastructure|Presentation)`, and that shape would hand every module
    # granted this layer the whole of Catalog's domain — `SaveCatalogItem`, the
    # drafts, the listing criteria. `Precision`'s entry in `deptrac.layers.yaml`
    # is the better precedent and the narrower promise: exactly the interface
    # that was published, and nothing that happens to sit beside it. It stays
    # narrow only while the signature is primitives, which is why
    # `CatalogProductProvisionerInterface` takes a name and returns an id.
    - name: CatalogContract
      collectors:
        - type: classLike
          value: ^App\\Modules\\Catalog\\Domain\\Contracts\\CatalogProductProvisionerInterface$
        # F-16 · 1.1: a quotation line's product name — strings in and out too.
        - type: classLike
          value: ^App\\Modules\\Catalog\\Domain\\Contracts\\CatalogItemLabelsInterface$
    # Suppliers' published lookup, added with F-10 · 1.4 — `D-86`'s import turns
    # a `supplier` cell into ids, and Catalog may not read `suppliers` itself.
    # Strings in and out, so one classLike holds it, as `CatalogContract` does.
    - name: SuppliersContract
      collectors:
        - type: classLike
          value: ^App\\Modules\\Suppliers\\Domain\\Contracts\\SupplierLookupInterface$
    # Quotations' published read, added 2026-09-22 with F-14 · 1.1 at Module 9's
    # request: `find()` and the four value classes it returns or throws, and
    # none of the writes — so a module can be granted a quotation without
    # `EloquentQuotationDirectory`, its models, or `create`/`update`/`delete`.
    # Granted to Quotations here; Pdf's grant arrives with its Point 1.2.
    - name: QuotationsContract
      collectors:
        - type: classLike
          value: ^App\\Modules\\Quotations\\Domain\\Contracts\\QuotationReaderInterface$
        - type: classLike
          value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationDetail$
        - type: classLike
          value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationLine$
        - type: classLike
          value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationAdditionalLine$
        - type: classLike
          value: ^App\\Modules\\Quotations\\Domain\\Listing\\QuotationNotFound$

    # SupplierQuotations' published price read, added 2026-09-11 with Module 7
    # Point 3.3 — §5.6 makes a customer quotation read one supplier line's
    # price, and `D-21` puts that price in Module 6. Narrow like
    # `CatalogContract`, not a `(Domain|Application)` split: exactly the one
    # interface another module needs and the value object it returns, so the
    # directory, its drafts and its listing stay out of Module 7's reach. Two
    # `classLike`s rather than one because the read returns an object — the
    # interface alone would leave `SupplierItemPrice` an uncovered dependency
    # the moment Module 7 read a field off it.
    - name: SupplierQuotationsContract
      collectors:
        - type: classLike
          value: ^App\\Modules\\SupplierQuotations\\Domain\\Contracts\\SupplierItemPricingInterface$
        - type: classLike
          value: ^App\\Modules\\SupplierQuotations\\Domain\\Pricing\\SupplierItemPrice$

    # `DealsContract`, on `SupplierQuotationsContract`'s exact shape: the one
    # interface Module 7 reads off a deal and the value object it returns.
    # `DealFacts` is a second classLike for the same reason `SupplierItemPrice`
    # is — the moment Module 7 reads `->ownerId` off the result, the result is
    # a dependency. Added 2026-09-11 with Module 7 Point 3.4.
    - name: DealsContract
      collectors:
        - type: classLike
          value: ^App\\Modules\\Deals\\Domain\\Contracts\\DealFactsInterface$
        - type: classLike
          value: ^App\\Modules\\Deals\\Domain\\Contracts\\DealFacts$

    # `Idempotency` — `OpenAPI §9.1`'s store, added 2026-09-12 with Module 7
    # Point 3.7. One directory layer, **not** a Contract/Driver split: no
    # module names it. Routes reach it by the `idempotency` alias and
    # `bootstrap/app.php` renders its refusal, both outside `paths`. The day a
    # module imports it, split it on Audit's terms and grant the contract half.
    - name: Idempotency
      collectors:
        - type: directory
          value: app/Modules/Idempotency/.*

    - name: StorageContract
      collectors:
        - type: directory
          value: app/Modules/Storage/(Domain|Application)/.*

    - name: StorageDriver
      collectors:
        - type: directory
          value: app/Modules/Storage/(Infrastructure|Presentation)/.*

    # Customers is split for the reason Identity, Audit and Storage already
    # are, on the crossing this file's own header names as the pattern: "when
    # a legitimate shared interface appears it is added here as a named
    # exception with a reason". Added 2026-08-31 with Deals' Point 3.1 —
    # `recompute_customer_status` (§4.5, `D-49`) is Module 5's rule, and the
    # rule writes one column on a table Module 5 does not own. Before this
    # point nothing outside Customers depended on it, so the flat `Customers`
    # layer cost nothing; this is that crossing actually happening. Contract
    # is `CustomerStatusWriterInterface` (`Domain/Contracts`) — the *only*
    # thing Deals is allowed to reach; nothing points at `CustomersDriver`,
    # and nothing should.
    - name: CustomersContract
      collectors:
        - type: directory
          value: app/Modules/Customers/(Domain|Application)/.*

    - name: CustomersDriver
      collectors:
        - type: directory
          value: app/Modules/Customers/(Infrastructure|Presentation)/.*

    # Model factories are test and seed scaffolding rather than a module, and
    # they live in `database/factories` because that is where Laravel's tooling
    # looks. A model naming its own factory is the framework's own pattern, so
    # the dependency is legitimate — but it is named here rather than left
    # uncovered, because an uncovered line does not fail the build and a report
    # that accumulates them is a report nobody reads.
    - name: Factories
      collectors:
        - type: classLike
          value: ^Database\\Factories\\.*

    # The framework is named here for the same reason it is named in
    # deptrac.layers.yaml: without it every Illuminate call from a covered class
    # is an uncovered dependency, and a report full of uncovered lines is a
    # report nobody reads.
    # `App\Support\Settings` — the contract a module reads a tunable number
    # through. Named as its own layer rather than left uncovered: an uncovered
    # line does not fail the build, and this file already records why that
    # matters. Deliberately narrow — `^App\\Support\\Settings\\.*` and not all of
    # `App\Support`, so a future helper there does not inherit a licence to be
    # a cross-module channel.
    - name: SharedContracts
      collectors:
        - type: classLike
          value: ^App\\Support\\Settings\\.*
        # `App\Support\Http` — the shared response envelope, moved out of
        # Identity and Admin by Module 3's shared-layer point. See the matching
        # comment in `deptrac.layers.yaml` for why the duplication ended here.
        - type: classLike
          value: ^App\\Support\\Http\\.*
        # `D-48`'s search seam. Added with Module 3 Point 3.2, which is the
        # first module dependency on it — `deptrac.layers.yaml` has carried the
        # same entry since Point 2.1.
        - type: classLike
          value: ^App\\Support\\Search\\.*
        # `App\Support\Database\Precision` — `D-68`'s column scales, added
        # 2026-09-02 with Module 6 Point 1.3, the first Eloquent model to cast a
        # money column. The class exists so that a column's scale and its cast's
        # scale cannot drift apart, which is only possible if the model may name
        # it. Narrow to the one class, **not** `^App\Support\Database\.*`:
        # `StandardColumns` is migration scaffolding and a module has no
        # business calling it, so the namespace would grant more than the
        # dependency needs.
        - type: classLike
          value: ^App\\Support\\Database\\Precision$
        # `App\Support\Database\DocumentNumberAllocator` — §4.7's document
        # number, added 2026-09-07 with Module 7 Point 1.6. `DL` (Module 5) and
        # `SQ` (Module 6) each carried a byte-identical private `nextCode()`,
        # and Module 7's `QT` would have been the third — so the mechanism moved
        # to `App\Support` and the prefix stayed with the module. Named class by
        # class on `Precision`'s terms, **not** `^App\Support\Database\.*`,
        # which would hand every module `StandardColumns` as well. No ruleset
        # moves: `Deals` and `SupplierQuotations` already hold `SharedContracts`.
        - type: classLike
          value: ^App\\Support\\Database\\DocumentNumberAllocator$
        # `App\Support\Csv` — the import file reader, moved out of Customers'
        # `CustomerCsv` unchanged in F-09 · 1.3 so the suppliers' import
        # (`D-85`) reads files by the same rules instead of a copy of them.
        # F-10 · 1.2 added the upload request and the batch payload both
        # imports shared; the namespace is named because it holds only these.
        - type: classLike
          value: ^App\\Support\\Csv\\.*

    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Symfony\\.*
        - type: classLike
          value: ^Laravel\\.*

  ruleset:
    # Customers → Framework, SharedContracts, IdentityContract, added 2026-08-30
    # with Point 3.2, the module's first endpoint.
    #
    # `Framework` because a controller, a Form Request and an Eloquent model are
    # framework objects by definition — the same reason Admin gained it.
    # `SharedContracts` for `App\Support\Http`'s response envelope and `D-48`'s
    # `SearchService`, which is the whole point of putting both in `App\Support`.
    #
    # `IdentityContract` is the load-bearing one, and it is the crossing this
    # file predicted: *"SEC-07 makes this the module every other module will
    # eventually ask about permissions, which is exactly why the crossing has to
    # be a named interface later rather than a reach into a model now."*
    # `SEC-08` requires row-level scoping, and a module cannot scope rows without
    # knowing what the caller's grant reaches — so Customers reads Identity's
    # `PermissionDecision` off the request, and asks `UserDirectoryInterface`
    # which owners are deactivated for §10.1's filter. It points at the
    # **contract** half only; nothing points at `IdentityDriver`, and nothing
    # should — that is what the Identity split exists to keep true.
    # `StorageContract` added 2026-08-30 with Point 3.6 — the crossing this
    # file's own header anticipated: "a module may later be allowed to depend on
    # StorageContract, which is the interfaces and the use cases". §14.2 puts
    # the local file system behind an abstraction and `StorageServiceTest`
    # enforces it as a property of every file in the application, so a module
    # that must read an uploaded CSV cannot open it and must ask. Contract half
    # only; nothing points at `StorageDriver`, and nothing should.
    #
    # `AuditContract` added 2026-08-30 with Point 3.3, on exactly the terms
    # Identity's crossing of 2026-08-24 and Admin's of 2026-08-27 were added:
    # `AUD-01` names create and update among what must be recorded, and the
    # recorder is an interface in `Audit\Domain`. The *contract* half only;
    # nothing points at `AuditDriver`, and nothing should.
    #
    # Split into CustomersContract / CustomersDriver 2026-08-31 with Deals'
    # Point 3.1 — the crossing that made a flat `Customers` layer insufficient
    # (see the layer definitions above). Both halves keep every entry the flat
    # layer held, on `IdentityContract`/`IdentityDriver`'s own precedent:
    # the split narrows who may reach *this* module, not what it may reach.
    CustomersContract:
      - Framework
      - SharedContracts
      - IdentityContract
      - AuditContract
      - StorageContract
    CustomersDriver:
      - CustomersContract
      - Framework
      - SharedContracts
      - IdentityContract
      - AuditContract
      - StorageContract
    # Deals → Framework, SharedContracts, IdentityContract, added 2026-08-31
    # with Point 2.2, the module's first endpoint. Granted on exactly
    # Customers' terms (2026-08-30): a controller, a Form Request and an
    # Eloquent model are framework objects by definition; `App\Support\Http`'s
    # envelope and `D-48`'s `SearchService` are `SharedContracts`' whole point.
    #
    # `IdentityContract` for the reason Customers took it: `SEC-08` requires
    # row-level scoping, and `DealController` reads `PermissionDecision` off
    # the request the same way `CustomerController` does. **No `UserDirectoryInterface`
    # use, unlike Customers** — §3.4 has no analogue to §10.1's "customers of
    # deactivated employees" filter, so only the two classes Customers' own
    # crossing already named are reached here.
    #
    # `AuditContract` added 2026-08-31 with Point 2.3, the module's first
    # write, on exactly the terms every other module's first write was
    # granted it: `AUD-01` names create and update among what must be
    # recorded, and the recorder is an interface in `Audit\Domain`. The
    # *contract* half only; nothing points at `AuditDriver`, and nothing
    # should.
    #
    # `CustomersContract` added 2026-08-31 with Point 3.1, the crossing that
    # forced the split above: `recompute_customer_status` (§4.5, `D-49`)
    # writes `customers.customer_status` through
    # `CustomerStatusWriterInterface`. The *contract* half only; nothing
    # points at `CustomersDriver`, and nothing should.
    #
    # `StorageContract` added 2026-08-31 with Point 4.1, `POST /deals/{id}/documents`
    # — the crossing this file's own header anticipated for Customers and
    # Deals is now real: §17's upload flow lives behind `StorageServiceInterface`,
    # `UploadValidatorInterface` and the new `FileWriterInterface`, and
    # `DealAttachmentPermission` *implements* `AttachmentPermissionInterface`
    # rather than calling it — the same contract half either direction, since
    # deptrac does not distinguish "depends on" from "implements". The
    # *contract* half only; nothing points at `StorageDriver`, and nothing
    # should.
    Deals:
      - Framework
      - SharedContracts
      - IdentityContract
      - AuditContract
      - CustomersContract
      - StorageContract
      # DealsContract, added 2026-09-11 with Module 7 Point 3.4 — the module
      # needs its own published interface back, exactly as SupplierQuotations
      # does below: `EloquentDealFacts` implements it.
      - DealsContract
    # Quotations → Framework, SharedContracts, added 2026-09-07 with Point 1.7,
    # the module's first code. **Two entries, the shortest ruleset granted since
    # SupplierQuotations' own Point 1.3**, and each absence is a decision:
    #
    # `Framework` because an Eloquent model and a `ConnectionInterface` are
    # framework objects by definition — the same reason every module before it
    # took this entry.
    #
    # `SharedContracts` for **two classes**: `App\Support\Database\Precision`,
    # `D-68`'s column scales, which the model names so its casts cannot drift
    # from the columns; and `App\Support\Database\DocumentNumberAllocator`,
    # §4.7's `QT-` number, which Point 1.6 extracted precisely so this module
    # would not copy it a third time. Not `App\Support\Http`'s envelope —
    # there is no controller until Step 3 — and not `D-48`'s `SearchService`,
    # which is Step 5's concern.
    #
    # **No `IdentityContract` yet, and that absence is temporary.** §3.5 grants
    # `quotation.view` as `own`, `team`, `asgn` and `all`, so `SEC-08` will make
    # every reader here ask Identity what the caller's grant reaches — unlike
    # §3.6, where the absence is permanent. Point 1.7 publishes `create()` only
    # and a create reads no row, so the crossing is not needed yet; Step 3's
    # `find()` is the point that needs it, and it will be a decision in a diff.
    #
    # **`AuditContract`, `AdminContract`, `CustomersContract` and
    # `SupplierQuotationsContract` added 2026-09-11 with Point 3.3** —
    # `CreateQuotation`, the create §5 and §6 need. It owns `DB-11`'s transaction
    # and records `QUOTATION_CREATED` (`AuditContract`); prices each line from
    # Module 6's supplier price (`SupplierQuotationsContract`), converts it at
    # the FX rate and reads the currency's rounding (`AdminContract` —
    # `CurrencyRepositoryInterface`, `FxRateRepositoryInterface` and the money
    # value objects); and derives the tax line from the customer's exemption
    # (`CustomersContract`, `CustomerTaxStatusInterface`). Each crossing is a
    # named interface, never a reach into a model. `IdentityContract` is still
    # absent and still temporary — §3.5's `find()` (Point 3.5) is the reader
    # that needs it, not this write.
    # **`DealsContract` and `IdentityContract` added 2026-09-11 with Point 3.4**
    # — `POST /quotations`. §3.5's `create` row is scoped (`All · Team · Own`),
    # and a scope on a create can only constrain *which deal* is quoted: the
    # owner ruled that a quotation's "own" is its deal's `owner_id`, so the use
    # case reads `DealFactsInterface` (`DealsContract`) and refuses with
    # `AuthorizationRefused` while the controller reads `PermissionDecision` off
    # the request (`IdentityContract`). The 3.3 note above said `IdentityContract`
    # would arrive with 3.5's `find()`; the scoped create needed it first.
    Quotations:
      - Framework
      - SharedContracts
      - AdminContract
      - AuditContract
      - CustomersContract
      - SupplierQuotationsContract
      - DealsContract
      - IdentityContract
      # CatalogContract, F-16 · 1.1: the product name on a quotation line
      # (`CatalogItemLabelsInterface`), which Quotations may not read itself.
      - CatalogContract
      # QuotationsContract, F-14 · 1.1: the module's own read half, collected
      # out by the narrow classLikes above, as Suppliers' grant of SuppliersContract.
      - QuotationsContract
    # SupplierQuotations → Framework, added 2026-09-02 with Point 1.3, the
    # module's first code. **One entry, which is the shortest ruleset any module
    # has been granted**, and each absence is a decision:
    #
    # `Framework` because an Eloquent model and a `ConnectionInterface` are
    # framework objects by definition — the same reason every module before it
    # took this entry.
    #
    # `SharedContracts` for **one class**: `App\Support\Database\Precision`,
    # `D-68`'s column scales, which the model names so that its cast cannot
    # drift from the column. Not for `App\Support\Http`'s envelope — there is
    # no controller yet — and not for `D-48`'s `SearchService`, which is Step
    # 4's concern. The layer was widened by exactly one `classLike` entry rather
    # than by the `App\Support\Database` namespace, so `StandardColumns` — the
    # migration scaffolding next door — stays out of every module's reach.
    #
    # Written twice, because the first version of this comment said "No
    # `SharedContracts`" and was wrong: deptrac reported the dependency as
    # *uncovered* until `Precision` was given a layer, and as a **violation**
    # the moment it had one. The reasoning was checked by running the tool, not
    # by arguing with it.
    #
    # **No `IdentityContract`**, on Suppliers' terms rather than Customers':
    # §3.6 grants every role that sees this resource `Scope::All` — "a shared
    # screen — not restricted by ownership" — so the module never asks Identity
    # anything. If §3.6 ever gains a scope, this line changes and the crossing
    # is a decision in a diff, which is what this file exists for.
    #
    # `AuditContract` added 2026-09-02 with Point 2.1, the module's first write
    # that has an actor and an event to record — on exactly the terms every
    # other module's first write was granted it: `AUD-01` names create among
    # what must be recorded, and the recorder is an interface in `Audit\Domain`.
    # `CreateSupplierQuotation` owns the transaction and records
    # SUPPLIER_QUOTATION_CREATED. The *contract* half only; nothing points at
    # `AuditDriver`, and nothing should. Point 1.3's version of this comment
    # said the entry was not needed yet and named the point that would need it —
    # this is that point.
    SupplierQuotations:
      - Framework
      - SharedContracts
      - AuditContract
      # SupplierQuotationsContract, added 2026-09-11 with Module 7 Point 3.3 —
      # the module needs its own published interface back, exactly as Catalog
      # does above. `SupplierItemPricingInterface` and `SupplierItemPrice` were
      # collected out of the `SupplierQuotations` layer by the narrow classLikes,
      # so `EloquentSupplierItemPricing` — which implements the one and returns
      # the other — now depends on a layer rather than on a class next door.
      - SupplierQuotationsContract
      # CatalogContract, added 2026-09-03 with Point 3.1. `D-22` adds a missing
      # product to the catalog automatically, and §7.2's offer line is where a
      # missing product is discovered. One interface, taking a name and
      # returning an id — the caller arrives with Points 3.4 and 3.5, and the
      # grant is written here with the interface so the crossing is reviewed
      # once rather than inside a point about a Form Request.
      - CatalogContract
      # StorageContract and IdentityContract, added 2026-09-04 with Point 5.1 —
      # §7.2's `pdf_file` row, which `D-71` makes the `supplier_quotation_files`
      # pivot rather than a column.
      #
      # `StorageContract` is `AttachmentPermissionInterface` and the two value
      # objects its one method takes. This is Deals' crossing, taken on Deals'
      # terms (Point 4.1, `deptrac.modules.yaml` above): the download route is
      # parent-agnostic and carries `auth` alone, so `D-38` — "attachment
      # permission = permission on the parent entity" — can only be answered by
      # the module that owns the parent. Storage cannot answer it and says so in
      # the interface's own docblock.
      #
      # `IdentityContract` is `AuthorizeAction` and `Scope`, and it is the entry
      # this module went four steps without. Every route so far has been guarded
      # by `permission:` middleware, which needs nothing from the module. This
      # one is not: there is no middleware behind `mayView()`, so the module has
      # to ask Identity what the caller holds. **Not `SEC-08` row scoping** —
      # §3.6 grants one scope, `All`, and the class refuses a `RowScope`
      # parameter for the reason the directory interface already gives. The
      # question asked is only "does this actor hold `supplier_quotation.view`".
      - StorageContract
      - IdentityContract
      # DealsContract, added 2026-09-22 with F-13 · 1.2 (`D-88`). An offer is
      # searched by a fragment of its deal's code and shows that code beside
      # `deal_id`, and the codes live on `deals` — so the module reads them
      # through `DealFactsInterface` (`dealIdsMatchingCode`, `codesOf`), never
      # the table, on Quotations' terms above. The first caller is F-13 · 1.3.
      - DealsContract
    # Suppliers → Framework, SharedContracts, added 2026-08-30 with Point 2.1,
    # the module's first endpoint. Granted on the same terms as Customers, and
    # deliberately **two entries shorter**.
    #
    # `Framework` because a controller and an Eloquent model are framework
    # objects by definition. `SharedContracts` for `App\Support\Http`'s
    # response envelope and `D-48`'s `SearchService` — which is the whole point
    # of putting both in `App\Support`.
    #
    # **No `IdentityContract`, and that is the interesting half.** Customers
    # needs it because `SEC-08` makes it scope rows by owner, and a module
    # cannot scope rows without reading the caller's grant. §3.7 has no
    # ownership at all — its two columns are "All operational roles" and CEO,
    # and the seeded matrix gives every one of them `Scope::All` — so this
    # module never asks Identity anything. The route's `permission:catalog.view`
    # middleware is the enforcement (§3.12 rule 1), and it runs before the
    # controller. If §3.7 ever gains a scope, this line changes and the crossing
    # is a decision in a diff, which is what this file exists for.
    #
    # **No `AuditContract`** either: Point 2.1 publishes two GET routes and
    # `AUD-01` records writes. Point 2.2 adds the writes and will need it.
    #
    # `AuditContract` added 2026-08-30 with Point 2.2, the module's first write,
    # on exactly the terms Customers' crossing of the same day was added:
    # `AUD-01` names create and update among what must be recorded, and the
    # recorder is an interface in `Audit\Domain`. `D-45` makes it load-bearing
    # here rather than routine — opening catalog and supplier editing to every
    # employee is mitigated by *"every edit is written to the audit log"*. The
    # **contract** half only; nothing points at `AuditDriver`, and nothing should.
    #
    # `StorageContract` added 2026-09-21 with F-09 · 1.4 (`D-85`), on exactly
    # the terms Customers' crossing of 2026-08-30 was added: §14.2 puts the
    # file system behind an abstraction and `StorageServiceTest` forbids
    # `fopen` in a module, so the suppliers' import must ask for the uploaded
    # CSV's stream. Contract half only; nothing points at `StorageDriver`.
    Suppliers:
      - Framework
      - SharedContracts
      - AuditContract
      - StorageContract
      # SuppliersContract, F-10 · 1.4: `EloquentSupplierLookup` implements the
      # interface the narrow classLike collected out, as Catalog's grant below.
      - SuppliersContract
    # Catalog → Framework, SharedContracts, added 2026-08-30 with Point 3.1,
    # the module's first endpoint. The same two entries Suppliers was granted,
    # and for the same reasons — a controller and an Eloquent model are
    # framework objects by definition, and `App\Support\Http`'s envelope and
    # `D-48`'s `SearchService` are what `SharedContracts` exists to publish.
    #
    # **No `IdentityContract`**, on exactly Suppliers' terms: §3.7 is one table
    # covering the catalog *and* its suppliers, and every grant in it is
    # `Scope::All`. This module never asks Identity anything; the route's
    # `permission:catalog.view` middleware is the enforcement (§3.12 rule 1)
    # and it runs before the controller.
    #
    # **No `AuditContract`** either: Point 3.1 publishes two GET routes and
    # `AUD-01` records writes. Point 3.2 adds the writes and will need it —
    # `D-45` makes it load-bearing there, since opening catalog editing to
    # every employee is mitigated by *"every edit is written to the audit log"*.
    Catalog:
      - Framework
      - SharedContracts
      # CatalogContract, added 2026-09-03 with Module 6 Point 3.1. The module
      # needs its own published interface back: `CatalogProductProvisionerInterface`
      # was collected out of the `Catalog` layer by the narrow `classLike` above,
      # so `ProvisionCatalogProduct` — which implements it — now depends on a
      # layer rather than on a class next door.
      - CatalogContract
      # AuditContract, added 2026-08-31 with Point 3.2 — the module's first
      # write. `D-45` opened catalog editing to every employee and named the
      # mitigation: "every edit is written to the audit log". The same entry
      # Suppliers holds, for the same requirement.
      - AuditContract
      # AdminContract, added 2026-08-31 with Point 6.3. §7.3 files an item under
      # a company and Point 5.1 made the company a `DB-05` managed list, so the
      # place a company is *defined* is Admin. Owner's ruling of the same day:
      # a company typed into the catalog form joins the list, which means this
      # module reaching Admin's contract rather than keeping a second list of
      # its own — the exact duplication `DB-05` exists to prevent, and the
      # crossing `SaveCatalogItemRequest`'s docblock predicted would be needed.
      # It points at the contract half only; nothing points at AdminDriver.
      - AdminContract
      # SuppliersContract, F-10 · 1.4 — `D-86`'s import links an item to the
      # supplier its `supplier` cell names. Written with the interface, as
      # `CatalogContract` was; the caller arrives with point 1.5.
      - SuppliersContract
      # StorageContract, F-10 · 1.5 — `D-86`'s import reads the upload through
      # `StorageServiceInterface::readUploadStream`, the one place a file may be
      # opened; the grant Suppliers holds for its own import.
      - StorageContract
    Procurement: ~
    Outdoor: ~
    Reports: ~
    Notifications: ~
    # Pdf, Module 9 — empty until Point 1.2, whose mapper is the first class
    # that crosses. Each grant names what the customer's document needs.
    Pdf:
      # AdminContract, Point 1.2 — §13 screen 4 and §14.6 make the company's
      # name, address and phones the Super Admin's settings, read through
      # `SettingsRepositoryInterface`, never hard-coded into the document.
      # It points at the contract half only; nothing points at AdminDriver.
      - AdminContract
      # CustomersContract, Point 1.2 — the customer's name through
      # `CustomerNamesInterface` (`D-83`), and nothing else of the customer.
      - CustomersContract
    # Admin → Framework, added 2026-08-27 with Point 2.1. Until now Admin held
    # only framework-free domain classes and an empty ruleset cost nothing; the
    # `currencies` table gives it its first Eloquent model, which cannot exist
    # without Illuminate. **This does not weaken the Domain rule** — that is
    # deptrac.layers.yaml's empty Domain ruleset, a separate config, and the
    # model lives in Infrastructure precisely because of it. No split into
    # AdminContract / AdminDriver yet: nothing outside Admin points at it, and
    # the Identity split exists to serve a crossing that actually happened.
    AdminContract:
      - Framework
      # Admin implements the settings contract; Identity reads through it. See
      # App\Support\Settings\SettingReader for why the contract sits outside
      # both modules rather than inside this one.
      - SharedContracts
      # Admin → AuditContract, added 2026-08-27 with Point 3.1, on the same
      # terms as Identity's crossing of 2026-08-24: `AUD-01` asks for a
      # comprehensive audit, so every module that writes business rows writes
      # audit rows, and the crossing is mandatory rather than convenient. §13
      # screen 4 edits the company name that §16 prints on every quotation —
      # a change that should not happen without a trace. It points at the
      # *contract* half only; nothing points at AuditDriver, and nothing should.
      - AuditContract

    # The driver half holds the Eloquent models and the controllers, and needs
    # its own contract half plus everything that half needs.
    AdminDriver:
      - Framework
      - SharedContracts
      - AuditContract
      - AdminContract
    # Contracts may reach the framework but never the driver — the point of the
    # split. The driver may use its own contracts, which is what implementing
    # them means.
    # Audit is split for the same reason Storage is: the contract half is what
    # another module may one day depend on, and the driver half — PostgreSQL
    # DDL, an Artisan command — is what it must never reach.
    # Identity → AuditContract, added 2026-08-24 with Point 2.2. `AUD-01`
    # requires a comprehensive audit and `SEC-16` names the failed-login log
    # outright, so every module writes audit rows — the crossing is mandatory
    # rather than convenient. It points at the *contract* half only, which is
    # exactly the crossing the Audit split was made to allow: "the contract half
    # is what another module may one day depend on". Nothing points at
    # AuditDriver, and nothing ever should.
    IdentityContract:
      - AuditContract
      - Framework
      # D-75: the lockout duration is a row now, read through the shared
      # contract. Identity never learns Admin's name.
      - SharedContracts
    IdentityDriver:
      - IdentityContract
      - AuditContract
      - Framework
      - Factories
      # The shared response envelope its own controllers used to own.
      - SharedContracts
    AuditContract:
      - Framework
    # Framework alone: a middleware, a query builder and a JSON response, and
    # nothing another module owns.
    Idempotency:
      - Framework
    AuditDriver:
      - AuditContract
      - Framework
    StorageContract:
      - Framework
    StorageDriver:
      - StorageContract
      - Framework
    Framework: ~
    Factories: ~
    SharedContracts: ~
