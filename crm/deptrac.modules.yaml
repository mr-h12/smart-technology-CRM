# Enforces AP-02: the twelve modules, and that none reaches into another.
#
# CLAUDE.md is explicit — cross-module work goes through interfaces or domain
# events, never another module's models. Every module below therefore has an
# empty ruleset: no module may depend on any other.
#
# That is stricter than the end state will be, deliberately. When a legitimate
# shared interface appears it is added here as a named exception with a reason,
# so each crossing is a decision that shows up in a diff rather than a habit
# that accumulates. ERP-01 expects each module to be extractable later, and a
# boundary nobody can cross by accident is what makes that possible.
#
# Storage is the first such exception, approved 2026-08-22. It is **not** one of
# AP-02's twelve: §14.2 lists it as a stack row — "local file system behind an
# abstraction layer" — so it is a foundation capability the business modules
# consume, not a peer owning a slice of the domain. It is split in two on
# purpose. A module may later be allowed to depend on StorageContract, which is
# the interfaces and the use cases; nothing is ever allowed to depend on
# StorageDriver, which is the disk, the scanner and the HTTP surface. Before
# this entry existed the module was in no layer at all, so a module reaching
# straight into the driver was reported as *uncovered* — and uncovered does not
# fail the build.
parameters:
  paths:
    - ./app/Modules
  layers:
    - name: Deals
      collectors:
        - type: directory
          value: app/Modules/Deals/.*
    - name: Quotations
      collectors:
        - type: directory
          value: app/Modules/Quotations/.*
    - name: Suppliers
      collectors:
        - type: directory
          value: app/Modules/Suppliers/.*
    - name: Catalog
      collectors:
        - type: directory
          value: app/Modules/Catalog/.*
    - name: Procurement
      collectors:
        - type: directory
          value: app/Modules/Procurement/.*
    - name: Outdoor
      collectors:
        - type: directory
          value: app/Modules/Outdoor/.*
    - name: Reports
      collectors:
        - type: directory
          value: app/Modules/Reports/.*
    - name: Notifications
      collectors:
        - type: directory
          value: app/Modules/Notifications/.*
    - name: Admin
      collectors:
        - type: directory
          value: app/Modules/Admin/.*

    # Identity is split for the reason Audit and Storage are, approved
    # 2026-08-23 with Point 2.1. Its Infrastructure holds the Eloquent models
    # for `users`, `roles`, `permissions` and `user_sessions`, and an Eloquent
    # model is a framework object by definition — so the module needs the
    # Framework layer that a bare `~` ruleset denies. The split keeps the line
    # in the right place: Domain and Application are what another module may
    # one day be allowed to depend on, and IdentityDriver — the models, the
    # tables, the HTTP surface — is what nothing may ever reach. SEC-07 makes
    # this the module every other module will eventually ask about permissions,
    # which is exactly why the crossing has to be a named interface later
    # rather than a reach into a model now.
    - name: IdentityContract
      collectors:
        - type: directory
          value: app/Modules/Identity/(Domain|Application)/.*

    - name: IdentityDriver
      collectors:
        - type: directory
          value: app/Modules/Identity/(Infrastructure|Presentation)/.*

    - name: AuditContract
      collectors:
        - type: directory
          value: app/Modules/Audit/(Domain|Application)/.*

    - name: AuditDriver
      collectors:
        - type: directory
          value: app/Modules/Audit/(Infrastructure|Presentation)/.*

    - name: StorageContract
      collectors:
        - type: directory
          value: app/Modules/Storage/(Domain|Application)/.*

    - name: StorageDriver
      collectors:
        - type: directory
          value: app/Modules/Storage/(Infrastructure|Presentation)/.*

    # Customers is split for the reason Identity, Audit and Storage already
    # are, on the crossing this file's own header names as the pattern: "when
    # a legitimate shared interface appears it is added here as a named
    # exception with a reason". Added 2026-08-31 with Deals' Point 3.1 —
    # `recompute_customer_status` (§4.5, `D-49`) is Module 5's rule, and the
    # rule writes one column on a table Module 5 does not own. Before this
    # point nothing outside Customers depended on it, so the flat `Customers`
    # layer cost nothing; this is that crossing actually happening. Contract
    # is `CustomerStatusWriterInterface` (`Domain/Contracts`) — the *only*
    # thing Deals is allowed to reach; nothing points at `CustomersDriver`,
    # and nothing should.
    - name: CustomersContract
      collectors:
        - type: directory
          value: app/Modules/Customers/(Domain|Application)/.*

    - name: CustomersDriver
      collectors:
        - type: directory
          value: app/Modules/Customers/(Infrastructure|Presentation)/.*

    # Model factories are test and seed scaffolding rather than a module, and
    # they live in `database/factories` because that is where Laravel's tooling
    # looks. A model naming its own factory is the framework's own pattern, so
    # the dependency is legitimate — but it is named here rather than left
    # uncovered, because an uncovered line does not fail the build and a report
    # that accumulates them is a report nobody reads.
    - name: Factories
      collectors:
        - type: classLike
          value: ^Database\\Factories\\.*

    # The framework is named here for the same reason it is named in
    # deptrac.layers.yaml: without it every Illuminate call from a covered class
    # is an uncovered dependency, and a report full of uncovered lines is a
    # report nobody reads.
    # `App\Support\Settings` — the contract a module reads a tunable number
    # through. Named as its own layer rather than left uncovered: an uncovered
    # line does not fail the build, and this file already records why that
    # matters. Deliberately narrow — `^App\\Support\\Settings\\.*` and not all of
    # `App\Support`, so a future helper there does not inherit a licence to be
    # a cross-module channel.
    - name: SharedContracts
      collectors:
        - type: classLike
          value: ^App\\Support\\Settings\\.*
        # `App\Support\Http` — the shared response envelope, moved out of
        # Identity and Admin by Module 3's shared-layer point. See the matching
        # comment in `deptrac.layers.yaml` for why the duplication ended here.
        - type: classLike
          value: ^App\\Support\\Http\\.*
        # `D-48`'s search seam. Added with Module 3 Point 3.2, which is the
        # first module dependency on it — `deptrac.layers.yaml` has carried the
        # same entry since Point 2.1.
        - type: classLike
          value: ^App\\Support\\Search\\.*

    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Symfony\\.*
        - type: classLike
          value: ^Laravel\\.*

  ruleset:
    # Customers → Framework, SharedContracts, IdentityContract, added 2026-08-30
    # with Point 3.2, the module's first endpoint.
    #
    # `Framework` because a controller, a Form Request and an Eloquent model are
    # framework objects by definition — the same reason Admin gained it.
    # `SharedContracts` for `App\Support\Http`'s response envelope and `D-48`'s
    # `SearchService`, which is the whole point of putting both in `App\Support`.
    #
    # `IdentityContract` is the load-bearing one, and it is the crossing this
    # file predicted: *"SEC-07 makes this the module every other module will
    # eventually ask about permissions, which is exactly why the crossing has to
    # be a named interface later rather than a reach into a model now."*
    # `SEC-08` requires row-level scoping, and a module cannot scope rows without
    # knowing what the caller's grant reaches — so Customers reads Identity's
    # `PermissionDecision` off the request, and asks `UserDirectoryInterface`
    # which owners are deactivated for §10.1's filter. It points at the
    # **contract** half only; nothing points at `IdentityDriver`, and nothing
    # should — that is what the Identity split exists to keep true.
    # `StorageContract` added 2026-08-30 with Point 3.6 — the crossing this
    # file's own header anticipated: "a module may later be allowed to depend on
    # StorageContract, which is the interfaces and the use cases". §14.2 puts
    # the local file system behind an abstraction and `StorageServiceTest`
    # enforces it as a property of every file in the application, so a module
    # that must read an uploaded CSV cannot open it and must ask. Contract half
    # only; nothing points at `StorageDriver`, and nothing should.
    #
    # `AuditContract` added 2026-08-30 with Point 3.3, on exactly the terms
    # Identity's crossing of 2026-08-24 and Admin's of 2026-08-27 were added:
    # `AUD-01` names create and update among what must be recorded, and the
    # recorder is an interface in `Audit\Domain`. The *contract* half only;
    # nothing points at `AuditDriver`, and nothing should.
    #
    # Split into CustomersContract / CustomersDriver 2026-08-31 with Deals'
    # Point 3.1 — the crossing that made a flat `Customers` layer insufficient
    # (see the layer definitions above). Both halves keep every entry the flat
    # layer held, on `IdentityContract`/`IdentityDriver`'s own precedent:
    # the split narrows who may reach *this* module, not what it may reach.
    CustomersContract:
      - Framework
      - SharedContracts
      - IdentityContract
      - AuditContract
      - StorageContract
    CustomersDriver:
      - CustomersContract
      - Framework
      - SharedContracts
      - IdentityContract
      - AuditContract
      - StorageContract
    # Deals → Framework, SharedContracts, IdentityContract, added 2026-08-31
    # with Point 2.2, the module's first endpoint. Granted on exactly
    # Customers' terms (2026-08-30): a controller, a Form Request and an
    # Eloquent model are framework objects by definition; `App\Support\Http`'s
    # envelope and `D-48`'s `SearchService` are `SharedContracts`' whole point.
    #
    # `IdentityContract` for the reason Customers took it: `SEC-08` requires
    # row-level scoping, and `DealController` reads `PermissionDecision` off
    # the request the same way `CustomerController` does. **No `UserDirectoryInterface`
    # use, unlike Customers** — §3.4 has no analogue to §10.1's "customers of
    # deactivated employees" filter, so only the two classes Customers' own
    # crossing already named are reached here.
    #
    # `AuditContract` added 2026-08-31 with Point 2.3, the module's first
    # write, on exactly the terms every other module's first write was
    # granted it: `AUD-01` names create and update among what must be
    # recorded, and the recorder is an interface in `Audit\Domain`. The
    # *contract* half only; nothing points at `AuditDriver`, and nothing
    # should.
    #
    # `CustomersContract` added 2026-08-31 with Point 3.1, the crossing that
    # forced the split above: `recompute_customer_status` (§4.5, `D-49`)
    # writes `customers.customer_status` through
    # `CustomerStatusWriterInterface`. The *contract* half only; nothing
    # points at `CustomersDriver`, and nothing should.
    Deals:
      - Framework
      - SharedContracts
      - IdentityContract
      - AuditContract
      - CustomersContract
    Quotations: ~
    # Suppliers → Framework, SharedContracts, added 2026-08-30 with Point 2.1,
    # the module's first endpoint. Granted on the same terms as Customers, and
    # deliberately **two entries shorter**.
    #
    # `Framework` because a controller and an Eloquent model are framework
    # objects by definition. `SharedContracts` for `App\Support\Http`'s
    # response envelope and `D-48`'s `SearchService` — which is the whole point
    # of putting both in `App\Support`.
    #
    # **No `IdentityContract`, and that is the interesting half.** Customers
    # needs it because `SEC-08` makes it scope rows by owner, and a module
    # cannot scope rows without reading the caller's grant. §3.7 has no
    # ownership at all — its two columns are "All operational roles" and CEO,
    # and the seeded matrix gives every one of them `Scope::All` — so this
    # module never asks Identity anything. The route's `permission:catalog.view`
    # middleware is the enforcement (§3.12 rule 1), and it runs before the
    # controller. If §3.7 ever gains a scope, this line changes and the crossing
    # is a decision in a diff, which is what this file exists for.
    #
    # **No `AuditContract`** either: Point 2.1 publishes two GET routes and
    # `AUD-01` records writes. Point 2.2 adds the writes and will need it.
    #
    # `AuditContract` added 2026-08-30 with Point 2.2, the module's first write,
    # on exactly the terms Customers' crossing of the same day was added:
    # `AUD-01` names create and update among what must be recorded, and the
    # recorder is an interface in `Audit\Domain`. `D-45` makes it load-bearing
    # here rather than routine — opening catalog and supplier editing to every
    # employee is mitigated by *"every edit is written to the audit log"*. The
    # **contract** half only; nothing points at `AuditDriver`, and nothing should.
    Suppliers:
      - Framework
      - SharedContracts
      - AuditContract
    # Catalog → Framework, SharedContracts, added 2026-08-30 with Point 3.1,
    # the module's first endpoint. The same two entries Suppliers was granted,
    # and for the same reasons — a controller and an Eloquent model are
    # framework objects by definition, and `App\Support\Http`'s envelope and
    # `D-48`'s `SearchService` are what `SharedContracts` exists to publish.
    #
    # **No `IdentityContract`**, on exactly Suppliers' terms: §3.7 is one table
    # covering the catalog *and* its suppliers, and every grant in it is
    # `Scope::All`. This module never asks Identity anything; the route's
    # `permission:catalog.view` middleware is the enforcement (§3.12 rule 1)
    # and it runs before the controller.
    #
    # **No `AuditContract`** either: Point 3.1 publishes two GET routes and
    # `AUD-01` records writes. Point 3.2 adds the writes and will need it —
    # `D-45` makes it load-bearing there, since opening catalog editing to
    # every employee is mitigated by *"every edit is written to the audit log"*.
    Catalog:
      - Framework
      - SharedContracts
      # AuditContract, added 2026-08-31 with Point 3.2 — the module's first
      # write. `D-45` opened catalog editing to every employee and named the
      # mitigation: "every edit is written to the audit log". The same entry
      # Suppliers holds, for the same requirement.
      - AuditContract
    Procurement: ~
    Outdoor: ~
    Reports: ~
    Notifications: ~
    # Admin → Framework, added 2026-08-27 with Point 2.1. Until now Admin held
    # only framework-free domain classes and an empty ruleset cost nothing; the
    # `currencies` table gives it its first Eloquent model, which cannot exist
    # without Illuminate. **This does not weaken the Domain rule** — that is
    # deptrac.layers.yaml's empty Domain ruleset, a separate config, and the
    # model lives in Infrastructure precisely because of it. No split into
    # AdminContract / AdminDriver yet: nothing outside Admin points at it, and
    # the Identity split exists to serve a crossing that actually happened.
    Admin:
      - Framework
      # Admin implements the settings contract; Identity reads through it. See
      # App\Support\Settings\SettingReader for why the contract sits outside
      # both modules rather than inside this one.
      - SharedContracts
      # Admin → AuditContract, added 2026-08-27 with Point 3.1, on the same
      # terms as Identity's crossing of 2026-08-24: `AUD-01` asks for a
      # comprehensive audit, so every module that writes business rows writes
      # audit rows, and the crossing is mandatory rather than convenient. §13
      # screen 4 edits the company name that §16 prints on every quotation —
      # a change that should not happen without a trace. It points at the
      # *contract* half only; nothing points at AuditDriver, and nothing should.
      - AuditContract
    # Contracts may reach the framework but never the driver — the point of the
    # split. The driver may use its own contracts, which is what implementing
    # them means.
    # Audit is split for the same reason Storage is: the contract half is what
    # another module may one day depend on, and the driver half — PostgreSQL
    # DDL, an Artisan command — is what it must never reach.
    # Identity → AuditContract, added 2026-08-24 with Point 2.2. `AUD-01`
    # requires a comprehensive audit and `SEC-16` names the failed-login log
    # outright, so every module writes audit rows — the crossing is mandatory
    # rather than convenient. It points at the *contract* half only, which is
    # exactly the crossing the Audit split was made to allow: "the contract half
    # is what another module may one day depend on". Nothing points at
    # AuditDriver, and nothing ever should.
    IdentityContract:
      - AuditContract
      - Framework
      # D-75: the lockout duration is a row now, read through the shared
      # contract. Identity never learns Admin's name.
      - SharedContracts
    IdentityDriver:
      - IdentityContract
      - AuditContract
      - Framework
      - Factories
      # The shared response envelope its own controllers used to own.
      - SharedContracts
    AuditContract:
      - Framework
    AuditDriver:
      - AuditContract
      - Framework
    StorageContract:
      - Framework
    StorageDriver:
      - StorageContract
      - Framework
    Framework: ~
    Factories: ~
    SharedContracts: ~
