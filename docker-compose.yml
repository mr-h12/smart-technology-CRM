# CRM local development environment — production-matched (D-66).
#
# Linux containers matching the §14.2 stack. Never run the stack on the host OS
# directly: developing on macOS hides the Linux font gap P-01 found, which is
# the exact defect D-66 exists to catch.
#
# Boot order is ST-02: PostgreSQL → Redis → Meilisearch → application → workers
# → Nginx. This file currently covers the first two; later points of Module 0
# step 0 extend the chain without reordering it.
#
# Versions are pinned deliberately. OD-03 (server specifications) is still open,
# so these are a recorded assumption, not a verified match — revisit when it
# closes.

# Everyday use starts PostgreSQL and Redis only:
#     docker compose up -d
#
# Three profiles exist, none active by default:
#     docker compose --profile search up -d                  # Meilisearch, Module 15 work
#     docker compose --profile workers up -d                 # queue workers, from step 1 on
#     docker compose --profile verify up boot-order-probe    # prove the ST-02 chain
#
# WARNING: `docker compose down` does NOT stop services whose profile is
# inactive, so a profiled container survives a teardown and is easy to mistake
# for a fresh one. Tearing down needs EVERY profile named — and this line is a
# maintenance hazard: it silently became wrong the moment `workers` was added
# in point 0.7, so extend it whenever a profile is added.
#     docker compose --profile search --profile workers --profile verify down
name: crm

services:
  # ── ST-02 position 1 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:17.5-bookworm
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      # No default. SEC-17 keeps secrets out of source; an unset value must fail
      # loudly rather than silently booting with a known password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # UTF-8 is not optional: the system stores Arabic across every text column
      # (§14.2). The locale is set at initdb time and cannot be changed later
      # without recreating the volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC          # DB-08 — timestamps are stored UTC and converted for display only
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback on purpose. Publishing to 0.0.0.0 would expose the
      # development database to the office LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -U/-d matter: the entrypoint runs a temporary server during initdb, and
      # a bare pg_isready reports ready against it before the real database
      # exists. start_period covers first-boot initialisation.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [crm]

  # ── ST-02 position 2 ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: crm-redis
    restart: unless-stopped
    # §14.2 puts cache, sessions, queues, rate limiting and locks on Redis.
    # A session store with no authentication is not acceptable even on an
    # internal network (§14.3), so requirepass is mandatory here.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --save ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # keeps the password out of the healthcheck argv
      TZ: UTC
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      # PING is answered before a large AOF finishes loading, so the response is
      # matched explicitly rather than trusting the exit code alone.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [crm]

  # ── ST-02 position 3 ─────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: crm-meilisearch
    restart: unless-stopped
    # D-48 defers Meilisearch to Module 15, but ST-02 puts it in the boot order
    # and BK-01 puts it in the backup set. It is defined from day one so that
    # adding a service to the stack late — the surprise D-66 exists to prevent —
    # never happens.
    #
    # It does not run by default. Measured idle, it holds ~95 MB for a service
    # nothing will call before Module 15, and OD-03's floor for this server is
    # 8 GB. Two profiles rather than one:
    #   verify — the boot-order probe asserts the full ST-02 chain, so the proof
    #            still covers all three services
    #   search — Module 15 work, and any time the real driver is wanted
    # Neither profile changes its position in the chain.
    profiles: [search, verify]
    depends_on:
      # Meilisearch has no real dependency on Redis. The chain is declared
      # anyway so the compose file matches ST-02 literally and the server's
      # unit ordering can be derived from it.
      redis:
        condition: service_healthy
    environment:
      # production, not development, and deliberately so: production mode is
      # what requires the master key and enables the API-key and tenant-token
      # machinery that Module 15 needs for permission-scoped search. Running
      # development mode locally would mean the first run with a key happens on
      # the real server — the class of surprise D-66 exists to catch. The cost
      # is the bundled search-preview UI, which production mode disables.
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_DB_PATH: /meili_data
      TZ: UTC
    volumes:
      - meili-data:/meili_data
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    healthcheck:
      # /health is unauthenticated by design, so the master key stays out of the
      # healthcheck. curl is present in the image (Alpine-based) — verified,
      # not assumed.
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health | grep -q available"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [crm]

  # ── ST-02 position 4 — the application ───────────────────────────────────────
  php:
    build:
      context: docker/php
      dockerfile: Dockerfile
      target: app          # no browser here — see the Dockerfile's pdf stage
    image: crm-php:app
    container_name: crm-php
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No DB_* or REDIS_* here on purpose. Laravel reads crm/.env, and injecting
    # the same keys as container environment variables made two sources of truth
    # — with the container's winning. That silently defeated phpunit.xml, whose
    # <env> does not override a variable that is already set, so the suite ran
    # against the development database while passing.
    #
    # They were added in 0.6 for the placeholder document root, which read them
    # with getenv(). That placeholder is gone.
    volumes:
      # The application. Not read-only: Laravel writes to storage/ and
      # bootstrap/cache at runtime — logs, compiled views, the cached config.
      - ./crm:/var/www/html
      # Laravel's writable paths are volumes, not part of the bind mount above.
      # A bind-mounted storage/ carries the host's ownership, which works on
      # macOS only because Docker Desktop rewrites it and fails on Linux where
      # it does not. Mounted deeper than /var/www/html, so these win.
      - laravel-storage:/var/www/html/storage
      - laravel-bootstrap-cache:/var/www/html/bootstrap/cache
      # §17: attachments live outside the application directory. Not mounted
      # into nginx, on purpose — see that service.
      - crm-storage:${STORAGE_PATH:-/var/crm-files}
    healthcheck:
      # php-fpm answers FastCGI, not HTTP, so a status page would need a pool
      # config change. Checking the CLI proves the runtime is alive without
      # opening an endpoint that would then have to be secured.
      test: ["CMD-SHELL", "php -r 'exit(extension_loaded(\"pdo_pgsql\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [crm]

  # ── ST-02 position 5 — queue workers (§15.1) ─────────────────────────────────
  #
  # Four queues, four services, in the documented priority order:
  #   1 critical     recovery and system health
  #   2 pdf          document generation
  #   3 reports      report generation
  #   4 maintenance  cleanup, indexing, aggregates
  #
  # Separate services rather than one worker consuming all four, because a
  # single worker draining `maintenance` cannot also be answering `critical`.
  # Priority in §15.1 is only real if the capacity is separated.
  #
  # Only `pdf` gets the browser image. That is the whole point of the split:
  # PRF-04 puts PDF generation on this queue and nowhere else, so the other
  # three run ~1.3 GB lighter.
  #
  # ⚠️ Profile-gated until step 1. The commands below are the real ones, and
  # `artisan` does not exist yet — without the profile these would crash-loop
  # against a missing file and make the stack look broken. Remove `profiles`
  # when the application lands.

  worker-critical:
    build: { context: docker/php, dockerfile: Dockerfile, target: app }
    image: crm-php:app
    container_name: crm-worker-critical
    profiles: [workers]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    # No DB_* or REDIS_* here on purpose. Laravel reads crm/.env, and injecting
    # the same keys as container environment variables made two sources of truth
    # — with the container's winning. That silently defeated phpunit.xml, whose
    # <env> does not override a variable that is already set, so the suite ran
    # against the development database while passing.
    #
    # They were added in 0.6 for the placeholder document root, which read them
    # with getenv(). That placeholder is gone.
    volumes:
      - ./crm:/var/www/html
      - laravel-storage:/var/www/html/storage
      - laravel-bootstrap-cache:/var/www/html/bootstrap/cache
      - crm-storage:${STORAGE_PATH:-/var/crm-files}
    command: ["php", "artisan", "queue:work", "redis", "--queue=critical", "--tries=3"]
    networks: [crm]

  worker-pdf:
    build: { context: docker/php, dockerfile: Dockerfile, target: pdf }
    image: crm-php:pdf
    container_name: crm-worker-pdf
    profiles: [workers]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./crm:/var/www/html
      - laravel-storage:/var/www/html/storage
      - laravel-bootstrap-cache:/var/www/html/bootstrap/cache
      - crm-storage:${STORAGE_PATH:-/var/crm-files}
    command: ["php", "artisan", "queue:work", "redis", "--queue=pdf", "--tries=3"]
    networks: [crm]

  worker-reports:
    build: { context: docker/php, dockerfile: Dockerfile, target: app }
    image: crm-php:app
    container_name: crm-worker-reports
    profiles: [workers]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./crm:/var/www/html
      - laravel-storage:/var/www/html/storage
      - laravel-bootstrap-cache:/var/www/html/bootstrap/cache
      - crm-storage:${STORAGE_PATH:-/var/crm-files}
    command: ["php", "artisan", "queue:work", "redis", "--queue=reports", "--tries=3"]
    networks: [crm]

  worker-maintenance:
    build: { context: docker/php, dockerfile: Dockerfile, target: app }
    image: crm-php:app
    container_name: crm-worker-maintenance
    profiles: [workers]
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./crm:/var/www/html
      - laravel-storage:/var/www/html/storage
      - laravel-bootstrap-cache:/var/www/html/bootstrap/cache
      - crm-storage:${STORAGE_PATH:-/var/crm-files}
    command: ["php", "artisan", "queue:work", "redis", "--queue=maintenance", "--tries=3"]
    networks: [crm]

  # ── One-shot: local TLS certificate ──────────────────────────────────────────
  # Runs, writes, exits. nginx waits for it to succeed.
  #
  # It uses the application image rather than nginx's own because nginx:alpine
  # ships no openssl binary — checked, after assuming otherwise and watching the
  # container restart-loop on exit 127. The Debian nginx image has openssl, but
  # pulling a second, larger base to run one command is the worse trade.
  #
  # Generated at runtime into a volume, never baked into an image and never
  # committed: an image carrying a private key ships the same key to every
  # environment that pulls it (SEC-17).
  certs:
    image: crm-php:app
    container_name: crm-certs
    # Root only for this one-shot, to own a fresh named volume. Everything that
    # serves traffic runs as www-data.
    user: "0:0"
    depends_on:
      php:
        condition: service_started
    volumes:
      - nginx-certs:/certs
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -f /certs/crm.crt ] && [ -f /certs/crm.key ]; then
          echo "certs: existing certificate kept"
          exit 0
        fi
        echo "certs: generating a self-signed certificate for local use"
        openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
          -keyout /certs/crm.key -out /certs/crm.crt \
          -subj "/CN=crm.localhost/O=Smart Technology CRM/OU=Local development" \
          -addext "subjectAltName=DNS:crm.localhost,DNS:localhost,IP:127.0.0.1" 2>/dev/null
        chmod 644 /certs/crm.crt
        chmod 640 /certs/crm.key
        echo "certs: done"
    networks: [crm]

  # ── ST-02 position 6 — Nginx (workers are position 5, point 0.7) ─────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx needs the document root to serve static files and to resolve
      # $realpath_root for fastcgi. Read-only here — the web server has no
      # business writing into the application.
      - ./crm:/var/www/html:ro
      - nginx-certs:/etc/nginx/certs:ro
      # crm-storage is deliberately NOT here. §17 requires every file to be
      # served through a permission-checking API and forbids direct access;
      # nginx never seeing the volume makes that structural rather than a
      # configuration rule that a later edit could quietly undo.
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    healthcheck:
      # -k because the certificate is self-signed; this asserts TLS terminates
      # and PHP answers through it, not that the chain is trusted.
      test: ["CMD-SHELL", "curl -fsSk https://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [crm]

  # ── Temporary: proves ST-03, removed once PHP-FPM lands in point 0.3/0.6 ─────
  # ST-03 requires each service to wait for its dependency, not merely to start
  # after it. `condition: service_healthy` is what enforces that; this service
  # exists only to make that behaviour observable before the app image exists.
  boot-order-probe:
    image: postgres:17.5-bookworm
    container_name: crm-boot-order-probe
    profiles: [verify]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    # A literal block, not a folded one: `>` keeps newlines on more-indented
    # continuation lines, which puts `&&` at the start of a line and breaks sh.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'select 1' > /dev/null
        echo "PROBE: postgres accepted a real query"
        exec 3<>/dev/tcp/redis/6379
        printf 'AUTH %s\r\nPING\r\n' "$$REDIS_PASSWORD" >&3
        # -n 2, not -c N: redis answers AUTH+PING in 11 bytes, so a byte-count
        # read blocks forever waiting for bytes that never arrive.
        head -n 2 <&3 | tr -d '\r' | grep -qx '+PONG'
        echo "PROBE: redis authenticated and answered PING"
        # Raw HTTP over /dev/tcp: this image ships psql, not curl. `Connection:
        # close` is what lets the read terminate instead of hanging.
        meili_get() {
          exec 3<>/dev/tcp/meilisearch/7700
          printf 'GET /indexes HTTP/1.1\r\nHost: meilisearch\r\nConnection: close\r\n' >&3
          [ -n "$$1" ] && printf '%s\r\n' "$$1" >&3
          printf '\r\n' >&3   # the blank line that terminates the headers
          cat <&3
          exec 3<&-
        }
        meili_get '' | head -1 | grep -q '401' \
          || { echo "PROBE FAIL: meilisearch did not reject an unauthenticated request"; exit 1; }
        echo "PROBE: meilisearch reachable and enforcing auth (401 without a key)"
        meili_get "Authorization: Bearer $$MEILI_MASTER_KEY" | head -1 | grep -q '200' \
          || { echo "PROBE FAIL: meilisearch rejected the master key"; exit 1; }
        echo "PROBE: meilisearch accepted the master key"
        echo "PROBE: all three dependencies were healthy before this container started"
    networks: [crm]

volumes:
  postgres-data:
  redis-data:
  meili-data:
  nginx-certs:
  # BK-01 puts files in the daily backup set alongside the database and index.
  laravel-storage:
  laravel-bootstrap-cache:
  crm-storage:

networks:
  crm:
    driver: bridge
