# Adapted from the nginx block Laravel's deployment documentation publishes.
# Kept close to it on purpose: step 1 introduces the real application into this
# same layout, and a config that already matches the documented one removes a
# class of "works locally, not in production" difference.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # SEC-14 requires HTTPS even internally. Plain HTTP exists only to redirect,
    # so a mistyped URL cannot quietly downgrade.
    #
    # $host carries no port, so locally this redirects to https://localhost/ —
    # port 443, not the mapped 8443. That is correct in production, where the
    # service listens on the standard ports, and only awkward here. Left as the
    # production-correct form rather than contorted for the dev port mapping;
    # reach the local stack at https://localhost:8443 directly.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/crm.crt;
    ssl_certificate_key /etc/nginx/certs/crm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Laravel serves from public/ and never from the project root — the docs are
    # explicit that moving index.php up exposes configuration to the internet.
    root  /var/www/html/public;
    index index.php;

    charset utf-8;   # §14.2: Arabic everywhere

    # §17 and D-71: a 30 MB attachment. nginx checks this before PHP sees the
    # request, and its default is 1 MB — so without this line the ceiling was
    # never the documented one, and the client got a 413 that named no limit.
    # Set above PHP's post_max_size so the application produces the error.
    client_max_body_size 40m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # F-26 · 1.1 (the owner's values, 2026-10-14). `always` puts them on error
    # responses too. §14.3: do not advertise the nginx version.
    server_tokens off;
    # SEC-14. No includeSubDomains: the Cloudflare hostname (D-59) shares its
    # domain with the client's other sites.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "same-origin" always;
    # SEC-13. The hash is welcome.blade.php's inline pre-paint theme script,
    # which ThemeFlashTest keeps inline; edit the script and this hash changes
    # with it (scripts/verify-headers.sh compares them). blob: is the file viewer.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-sZkEzgMkJbqQeDOeoFQBH5x+BIxLBMkZ8CAiVvPnpB0='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        # §14.3: do not advertise the stack.
        fastcgi_hide_header X-Powered-By;
    }

    # Dotfiles stay unreachable — .env sits one level up, but a misconfiguration
    # should not be the only thing standing between it and the network.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
