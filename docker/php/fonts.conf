<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Makes fontconfig's generic families resolve to the faces Design System §4.1
  names, instead of to whatever Debian happens to rank first.

  Why this file exists: installing the fonts was not enough. A request by
  explicit family name resolved correctly, but a *generic* request — which is
  what a renderer falls back to when a family is missing a glyph, and what
  Chrome uses for its own defaults — resolved Arabic to DejaVu Sans. DejaVu
  arrives as a dependency of fontconfig-config, is never chosen, and outranks
  Noto Sans Arabic in the default ordering.

  DejaVu shapes Arabic correctly, so this is not a correctness fix. It is a
  specification fix: §4.1 names Noto Sans Arabic, and a fallback that silently
  substitutes a different typeface mid-document is not the safety net the fonts
  were installed to be.
-->
<fontconfig>

  <!-- Arabic: every generic family resolves to Noto Sans Arabic. Noto Sans Mono
       carries no Arabic, so monospace has to come here too rather than fall
       through to DejaVu Sans Mono. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>

  <!-- Latin and numerals: Inter for UI sans, Noto Sans Mono for codes and IDs.
       §4.1 assigns numerals to Inter, which matters because money, counts and
       document codes are numeric and must not drift between faces. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>

</fontconfig>
