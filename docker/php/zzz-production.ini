; Production overrides for the CRM PHP image.
;
; NOT copied into the image. The image is the development image too, and these
; settings make development painful on purpose. Deployment mounts or copies this
; file into /usr/local/etc/php/conf.d/ — the base image parses every .ini there
; and later files win, so the zz-*.ini defaults are overridden without a rebuild.
;
;   docker run -v ./docker/php/zzz-production.ini:/usr/local/etc/php/conf.d/zzz-production.ini:ro ...
;
; Verified to take effect: opcache.validate_timestamps flips from On to Off.

; --- opcache -----------------------------------------------------------------
; The image ships validate_timestamps=1 so edits appear without a restart. In
; production that stats every file on every request and discards most of what
; opcache exists for. PRF-01 targets an API P95 under 500 ms, and the symptom of
; leaving this on is diffuse slowness that gets blamed on the database.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; --- errors ------------------------------------------------------------------
; PHP's built-in default is display_errors=1, and no php.ini is active in the
; official image. Laravel controls error display once it has booted, but a fatal
; before the framework loads — a parse error, memory exhaustion during autoload —
; prints raw to the response. Coding Standards §9 forbids exposing stack traces,
; SQL, or internal paths in browser responses; OpenAPI §5.1 says a 500 must never
; carry them.
display_errors=Off
display_startup_errors=Off

; log_errors and error_log are already set in the image: errors go to stderr in
; every environment so the container runtime collects them (AUD-06).
